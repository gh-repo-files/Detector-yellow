<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Детектор канарейки 🐤</title>
<style>
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #111; color: #eee;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 8px;
  }
  .camwrap { position: relative; width: 100%; max-width: 480px; }
  #video { width: 100%; display: block; border-radius: 8px; background: #000; }
  #overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    touch-action: manipulation; cursor: crosshair;
  }
  #status {
    font-size: 1.1em; margin: 8px; padding: 10px 16px;
    border-radius: 12px; background: #222; text-align: center;
  }
  #status.found { background: #1b5e20; }
  #debug { color: #888; font-size: 0.75em; margin: 4px; text-align: center; }
  #panel { display: flex; gap: 8px; margin: 6px; flex-wrap: wrap; justify-content: center; }
  button {
    font-size: 0.95em; padding: 10px 16px; border: none;
    border-radius: 20px; background: #ffd54f; color: #222;
  }
  button.off { background: #444; color: #aaa; }

  /* Окно обучения по фото */
  #trainModal {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.9);
    flex-direction: column; align-items: center; justify-content: center; padding: 12px;
  }
  #trainModal.open { display: flex; }
  #trainCanvas { max-width: 100%; max-height: 60vh; touch-action: none; border-radius: 6px; }
  #trainHint { margin: 10px; text-align: center; color: #ccc; font-size: 0.9em; }
  #trainBtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #trainBtns .ok { background: #4caf50; color: #fff; }
  #trainBtns .no { background: #f44336; color: #fff; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 18px; border-radius: 20px;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="camwrap">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>
<div id="status">Нажмите «Запустить камеру»</div>
<div id="debug"></div>
<div id="panel">
  <button id="btn">▶ Запустить камеру</button>
  <button id="flip">📷 Сменить камеру</button>
  <button id="sound" class="off">🔇 Звук: выкл</button>
  <button id="photo">🖼 Обучить по фото</button>
  <button id="forget">🗑 Забыть обучение</button>
</div>

<div id="trainModal">
  <div id="trainHint">Обведите канарейку прямоугольником пальцем/мышью,<br>затем выберите: это канарейка или на фото её нет</div>
  <canvas id="trainCanvas"></canvas>
  <div id="trainBtns">
    <button class="ok" id="trainPos">✓ Здесь канарейка</button>
    <button class="no" id="trainNeg">✗ Канарейки нет</button>
    <button id="trainClose">Закрыть</button>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<script>
const video    = document.getElementById('video');
const overlay  = document.getElementById('overlay');
const octx     = overlay.getContext('2d');
const statusEl = document.getElementById('status');
const debugEl  = document.getElementById('debug');
const btn      = document.getElementById('btn');
const flipBtn  = document.getElementById('flip');
const soundBtn = document.getElementById('sound');
const photoBtn = document.getElementById('photo');
const forgetBtn= document.getElementById('forget');
const toastEl  = document.getElementById('toast');

const W = 160, H = 120;
const INTERVAL_MS  = 1200;
const EMA_ALPHA    = 0.45;
const TRIGGER_EMA  = 0.33;
const RAW_HITS     = 2;
const COOLDOWN_MS  = 8000;
const TAP_RADIUS   = 7;
const MAX_SAMPLES  = 30;

let running = false, started = false;
let facing = 'environment', soundOn = false;
let alarmActive = false, lastAlarm = 0;
let prevCx = -1, prevCy = -1;
let emaScore = 0;
const rawVotes = [];

// ---------- Память обучения ----------
const LEARN_KEY = 'canary_learn_v2';
const PREFS_KEY = 'canary_prefs_v2';
let learn = { pos: [], neg: [] };

try {
  const saved = JSON.parse(localStorage.getItem(LEARN_KEY));
  if (saved && Array.isArray(saved.pos) && Array.isArray(saved.neg)) learn = saved;
} catch (e) {}
function saveLearn() { try { localStorage.setItem(LEARN_KEY, JSON.stringify(learn)); } catch (e) {} }

try {
  const prefs = JSON.parse(localStorage.getItem(PREFS_KEY)) || {};
  if (typeof prefs.soundOn === 'boolean') soundOn = prefs.soundOn;
  if (prefs.facing) facing = prefs.facing;
} catch (e) {}
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ soundOn, facing })); } catch (e) {}
}
soundBtn.textContent = soundOn ? '🔊 Звук: вкл' : '🔇 Звук: выкл';
soundBtn.classList.toggle('off', !soundOn);
flipBtn.textContent = facing === 'user' ? '🤳 Фронталка' : '📷 Сменить камеру';

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1800);
}

// ---------- Пищалка ----------
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
document.body.addEventListener('pointerdown', unlockAudio);
document.addEventListener('visibilitychange', () => { if (!document.hidden) unlockAudio(); });

function tone(freq, durMs, vol, delayMs) {
  if (!audioCtx || audioCtx.state !== 'running') return false;
  try {
    const t0 = audioCtx.currentTime + (delayMs || 0) / 1000;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs / 1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + durMs / 1000 + 0.05);
    return true;
  } catch (e) { return false; }
}
function chirp() {
  const ok = tone(1100, 110, 0.5, 0) && tone(1350, 110, 0.5, 140) && tone(1600, 200, 0.5, 280);
  if (!ok && navigator.vibrate) navigator.vibrate([120, 80, 120, 80, 200]);
}
let alarmTimer = null;
function setAlarm(on) {
  if (on === alarmActive) return;
  alarmActive = on;
  if (on) { unlockAudio(); chirp(); alarmTimer = setInterval(chirp, 1100); }
  else if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
}

soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊 Звук: вкл' : '🔇 Звук: выкл';
  soundBtn.classList.toggle('off', !soundOn);
  savePrefs();
  if (soundOn) { unlockAudio(); chirp(); }
});

forgetBtn.addEventListener('click', () => {
  learn = { pos: [], neg: [] };
  saveLearn();
  showToast('Обучение сброшено');
});

// ---------- Камера: устойчивый запуск ----------
async function start() {
  if (started) return;
  btn.disabled = true; btn.textContent = '▶ Запускаю…';
  statusEl.textContent = 'Запрашиваю доступ к камере…';
  try {
    await openStream();
    started = true;
    btn.textContent = '▶ Работает';
    running = true;
    statusEl.textContent = 'Ищу канарейку… тап по рамке = «канарейка», тап мимо = «не канарейка»';
    setInterval(analyze, INTERVAL_MS);
  } catch (e) {
    btn.disabled = false; btn.textContent = '▶ Запустить камеру';
    let msg = 'Не удалось запустить камеру: ' + (e.message || e);
    if (e && e.name === 'NotAllowedError') msg = 'Доступ к камере запрещён. Разрешите камеру в настройках сайта (иконка слева от адреса) и попробуйте снова.';
    if (e && e.name === 'NotFoundError') msg = 'Камера не найдена на этом устройстве.';
    statusEl.textContent = msg;
  }
}
btn.addEventListener('click', start);

async function openStream() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing },
             width: { ideal: 640 }, height: { ideal: 480 },
             frameRate: { ideal: 5, max: 15 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  const track = stream.getVideoTracks()[0];
  if (track && 'contentHint' in track) track.contentHint = 'motion';
}

// Оверлей подстраиваем под реальный размер видео, как только оно готово
video.addEventListener('loadedmetadata', () => {
  overlay.width  = video.videoWidth  || 640;
  overlay.height = video.videoHeight || 480;
});

async function flipCamera() {
  facing = facing === 'environment' ? 'user' : 'environment';
  flipBtn.textContent = facing === 'user' ? '🤳 Фронталка' : '📷 Сменить камеру';
  savePrefs();
  avgReady = false;
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    try { await openStream(); } catch (e) { statusEl.textContent = 'Не удалось переключить камеру'; }
  }
}
flipBtn.addEventListener('click', flipCamera);

// ---------- Скользящее усреднение кадра ----------
const avgR = new Float32Array(W * H);
const avgG = new Float32Array(W * H);
const avgB = new Float32Array(W * H);
let avgReady = false;

const workCanvas = document.createElement('canvas');
workCanvas.width = W; workCanvas.height = H;
const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

// ---------- Цветовые гистограммы (отпечатки) ----------
const HBINS = 12, SBINS = 3, VBINS = 3;
function hsvOf(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const v = max / 255;
  const s = max === 0 ? 0 : (max - min) / max;
  let h = 0;
  if (max !== min) {
    const d = max - min;
    if (max === r)      h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
    else if (max === g) h = ((b - r) / d + 2) * 60;
    else                h = ((r - g) / d + 4) * 60;
  }
  return [h, s, v];
}
// Отпечаток из набора пикселей; цветные пиксели с шагом 2 — быстро и достаточно
function buildHist(collect) {
  const hist = new Float32Array(HBINS * SBINS * VBINS);
  let n = 0;
  for (const [r, g, b] of collect) {
    const [h, s, v] = hsvOf(r, g, b);
    if (s <= 0.15 || v <= 0.15) continue;
    const hi = Math.min(HBINS - 1, h / 30 | 0);
    const si = Math.min(SBINS - 1, s * SBINS | 0);
    const vi = Math.min(VBINS - 1, v * VBINS | 0);
    hist[hi * SBINS * VBINS + si * VBINS + vi]++;
    n++;
  }
  if (n === 0) return null;
  for (let i = 0; i < hist.length; i++) hist[i] /= n;
  return hist;
}
// Отпечаток пятна с камеры (по маске)
function histFromBlob(blob, mask) {
  const collect = [];
  for (let y = blob.minY; y <= blob.maxY; y++)
    for (let x = blob.minX; x <= blob.maxX; x++) {
      const p = y * W + x;
      if (mask[p]) collect.push([avgR[p], avgG[p], avgB[p]]);
    }
  return buildHist(collect);
}
// Отпечаток области вокруг тапа
function histFromTap(gx, gy) {
  const collect = [];
  for (let y = Math.max(0, gy - TAP_RADIUS); y <= Math.min(H - 1, gy + TAP_RADIUS); y++)
    for (let x = Math.max(0, gx - TAP_RADIUS); x <= Math.min(W - 1, gx + TAP_RADIUS); x++)
      collect.push([avgR[y * W + x], avgG[y * W + x], avgB[y * W + x]]);
  return buildHist(collect);
}
function sim(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += Math.min(a[i], b[i]);
  return s;
}
function learnedScore(hist) {
  if (!hist || (learn.pos.length === 0 && learn.neg.length === 0)) return null;
  let posBest = 0, negBest = 0;
  for (const h of learn.pos) posBest = Math.max(posBest, sim(hist, h));
  for (const h of learn.neg) negBest = Math.max(negBest, sim(hist, h));
  return Math.max(0, Math.min(1, 0.5 + (posBest - negBest) * 1.5));
}

// ---------- Тапы по живому видео: РАМКА = канарейка ----------
let flashUntil = 0, flashBox = null, flashColor = '#4f4', flashPoint = null;
function flashRect(b, color) { flashBox = b; flashColor = color; flashPoint = null; flashUntil = Date.now() + 1200; }
function flashTap(gx, gy, color) { flashPoint = [gx, gy]; flashColor = color; flashBox = null; flashUntil = Date.now() + 1200; }

overlay.addEventListener('pointerdown', (e) => {
  if (!running || !avgReady) return;
  const rect = overlay.getBoundingClientRect();
  const gx = Math.floor((e.clientX - rect.left) / rect.width  * W);
  const gy = Math.floor((e.clientY - rect.top)  / rect.height * H);
  if (gx < 0 || gy < 0 || gx >= W || gy >= H) return;

  const hit = lastBlobs.find(b => gx >= b.minX && gx <= b.maxX && gy >= b.minY && gy <= b.maxY);
  if (hit) {
    // Тап по рамке → «это канарейка»
    const hist = histFromBlob(hit, lastMask);
    if (hist) {
      learn.pos.push(hist);
      if (learn.pos.length > MAX_SAMPLES) learn.pos.shift();
      saveLearn();
      showToast('✓ Запомнил: канарейка (' + learn.pos.length + ')');
      flashRect(hit, '#4f4');
    }
  } else {
    // Тап мимо рамок → «здесь не канарейка»
    const hist = histFromTap(gx, gy);
    if (hist) {
      learn.neg.push(hist);
      if (learn.neg.length > MAX_SAMPLES) learn.neg.shift();
      saveLearn();
      showToast('✗ Запомнил: НЕ канарейка (' + learn.neg.length + ')');
      flashTap(gx, gy, '#f44');
    } else showToast('Слишком темно, нечего запоминать');
  }
});

// ---------- Обучение по загруженным фото ----------
const trainModal  = document.getElementById('trainModal');
const trainCanvas = document.getElementById('trainCanvas');
const trainCtx    = trainCanvas.getContext('2d');
const fileInput   = document.getElementById('fileInput');
let trainImg = null, trainScale = 1, dragStart = null, dragNow = null;

photoBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (!fileInput.files || !fileInput.files[0]) return;
  const file = fileInput.files[0];
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    trainImg = img;
    const maxW = 640;
    trainScale = Math.min(1, maxW / img.width);
    trainCanvas.width  = img.width  * trainScale;
    trainCanvas.height = img.height * trainScale;
    trainCtx.drawImage(img, 0, 0, trainCanvas.width, trainCanvas.height);
    dragStart = dragNow = null;
    trainModal.classList.add('open');
    URL.revokeObjectURL(url);
  };
  img.src = url;
  fileInput.value = '';
});

function trainPos(e) {
  const r = trainCanvas.getBoundingClientRect();
  return [(e.clientX - r.left) * (trainCanvas.width / r.width),
          (e.clientY - r.top)  * (trainCanvas.height / r.height)];
}
trainCanvas.addEventListener('pointerdown', e => { dragStart = trainPos(e); dragNow = dragStart; trainCanvas.setPointerCapture(e.pointerId); });
trainCanvas.addEventListener('pointermove', e => {
  if (!dragStart) return;
  dragNow = trainPos(e);
  trainCtx.drawImage(trainImg, 0, 0, trainCanvas.width, trainCanvas.height);
  const x = Math.min(dragStart[0], dragNow[0]), y = Math.min(dragStart[1], dragNow[1]);
  const w = Math.abs(dragNow[0] - dragStart[0]), h = Math.abs(dragNow[1] - dragStart[1]);
  trainCtx.lineWidth = 3; trainCtx.strokeStyle = '#4f4';
  trainCtx.strokeRect(x, y, w, h);
});
trainCanvas.addEventListener('pointerup', () => {});

function saveFromPhoto(isPos) {
  if (!trainImg) return;
  let rect;
  if (isPos) {
    if (!dragStart || !dragNow) { showToast('Сначала обведите канарейку'); return; }
    rect = [Math.min(dragStart[0], dragNow[0]), Math.min(dragStart[1], dragNow[1]),
            Math.max(dragStart[0], dragNow[0]), Math.max(dragStart[1], dragNow[1])];
  } else {
    rect = [0, 0, trainCanvas.width, trainCanvas.height]; // весь кадр как «не канарейка»
  }
  const data = trainCtx.getImageData(0, 0, trainCanvas.width, trainCanvas.height).data;
  const collect = [];
  const step = 3;
  for (let y = rect[1] | 0; y < rect[3]; y += step)
    for (let x = rect[0] | 0; x < rect[2]; x += step) {
      const i = ((y | 0) * trainCanvas.width + (x | 0)) * 4;
      collect.push([data[i], data[i+1], data[i+2]]);
    }
  const hist = buildHist(collect);
  if (!hist) { showToast('Не получилось извлечь цвета'); return; }
  if (isPos) {
    learn.pos.push(hist);
    if (learn.pos.length > MAX_SAMPLES) learn.pos.shift();
    showToast('✓ Канарейка с фото запомнена (' + learn.pos.length + ')');
  } else {
    learn.neg.push(hist);
    if (learn.neg.length > MAX_SAMPLES) learn.neg.shift();
    showToast('✗ Кадр без канарейки запомнен (' + learn.neg.length + ')');
  }
  saveLearn();
  trainModal.classList.remove('open');
}
document.getElementById('trainPos').addEventListener('click', () => saveFromPhoto(true));
document.getElementById('trainNeg').addEventListener('click', () => saveFromPhoto(false));
document.getElementById('trainClose').addEventListener('click', () => trainModal.classList.remove('open'));

// ---------- Освещение ----------
function medianLum() {
  const hist = new Uint16Array(32);
  for (let p = 0; p < W * H; p += 8) {
    const lum = (avgR[p] * 0.3 + avgG[p] * 0.59 + avgB[p] * 0.11) / 255;
    hist[Math.min(31, lum * 32 | 0)]++;
  }
  let acc = 0;
  const total = W * H / 8;
  for (let b = 0; b < 32; b++) { acc += hist[b]; if (acc > total / 3) return b / 32; }
  return 0.5;
}

// ---------- Форма пятна ----------
function blobScore(b, lum) {
  const minSize = lum < 0.35 ? 18 : 22;
  if (b.size < minSize) return 0;
  if (b.size > W * H * 0.5) return 0;
  if (b.fill < 0.42) return 0;
  if (b.ratio > 2.8) return 0;
  const ratioFit = 1 - Math.min(1, Math.log(b.ratio) / Math.log(2.8));
  const sizeBonus = Math.min(1, Math.sqrt(b.size / 500));
  return b.fill * (0.55 + 0.45 * ratioFit) * (0.5 + 0.5 * sizeBonus);
}

// ---------- Поиск связных пятен ----------
function findBlobs(mask) {
  const visited = new Uint8Array(W * H);
  const blobs = [];
  const stack = [];
  for (let start = 0; start < mask.length; start++) {
    if (!mask[start] || visited[start]) continue;
    stack.length = 0; stack.push(start);
    visited[start] = 1;
    let size = 0, sumX = 0, sumY = 0;
    let minX = W, maxX = 0, minY = H, maxY = 0;
    while (stack.length) {
      const p = stack.pop();
      const x = p % W, y = (p / W) | 0;
      size++; sumX += x; sumY += y;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (x > 0   && mask[p-1] && !visited[p-1]) { visited[p-1] = 1; stack.push(p-1); }
      if (x < W-1 && mask[p+1] && !visited[p+1]) { visited[p+1] = 1; stack.push(p+1); }
      if (y > 0   && mask[p-W] && !visited[p-W]) { visited[p-W] = 1; stack.push(p-W); }
      if (y < H-1 && mask[p+W] && !visited[p+W]) { visited[p+W] = 1; stack.push(p+W); }
    }
    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    blobs.push({ size, fill: size / (bw * bh),
                 ratio: Math.max(bw, bh) / Math.min(bw, bh),
                 cx: sumX / size, cy: sumY / size,
                 minX, maxX, minY, maxY, score: 0 });
  }
  return blobs;
}
function dilate(mask) {
  const copy = mask.slice();
  for (let p = 0; p < W * H; p++) {
    if (copy[p]) continue;
    const x = p % W, y = (p / W) | 0;
    if ((x > 0 && copy[p-1]) || (x < W-1 && copy[p+1]) ||
        (y > 0 && copy[p-W]) || (y < H-1 && copy[p+W])) mask[p] = 1;
  }
}

// ---------- Рамки на экране ----------
function drawOverlay() {
  const vw = overlay.width, vh = overlay.height;
  octx.clearRect(0, 0, vw, vh);
  if (!running) return;
  const sx = vw / W, sy = vh / H;

  for (const b of lastBlobs) {
    if (b.size < 8) continue;
    const isBest = (b === bestBlob);
    octx.lineWidth = isBest ? 4 : 2;
    octx.strokeStyle = isBest ? '#4f4' : '#ff3';
    octx.strokeRect(b.minX * sx, b.minY * sy, (b.maxX - b.minX + 1) * sx, (b.maxY - b.minY + 1) * sy);
    if (isBest) {
      octx.fillStyle = '#4f4';
      octx.font = 'bold 22px system-ui';
      octx.fillText('🐤 ' + (b.score * 100 | 0) + '%', b.minX * sx, Math.max(22, b.minY * sy - 6));
    }
  }

  if (Date.now() < flashUntil) {
    octx.lineWidth = 5;
    octx.strokeStyle = flashColor;
    if (flashBox) {
      octx.strokeRect(flashBox.minX * sx - 3, flashBox.minY * sy - 3,
                      (flashBox.maxX - flashBox.minX + 1) * sx + 6, (flashBox.maxY - flashBox.minY + 1) * sy + 6);
    } else if (flashPoint) {
      octx.beginPath();
      octx.arc((flashPoint[0] + 0.5) * sx, (flashPoint[1] + 0.5) * sy, TAP_RADIUS * sx, 0, Math.PI * 2);
      octx.stroke();
    }
  }
}

// ---------- Главный цикл ----------
let lastBlobs = [], lastMask = new Uint8Array(W * H), bestBlob = null;

function analyze() {
  if (!running || document.hidden || !video.videoWidth) return;

  ctx.drawImage(video, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;

  const a = avgReady ? EMA_ALPHA : 1;
  for (let p = 0, i = 0; p < W * H; p++, i += 4) {
    avgR[p] += (data[i]     - avgR[p]) * a;
    avgG[p] += (data[i + 1] - avgG[p]) * a;
    avgB[p] += (data[i + 2] - avgB[p]) * a;
  }
  avgReady = true;

  const lum = medianLum();
  const vMin = Math.min(0.55, Math.max(0.22, lum * 0.55));
  const sMin = lum > 0.75 ? 0.32 : 0.38;

  const mask = new Uint8Array(W * H);
  for (let p = 0; p < W * H; p++) {
    const [h, s, v] = hsvOf(avgR[p], avgG[p], avgB[p]);
    if (s <= sMin || v <= vMin || v >= 0.98) continue;
    if (h >= 33 && h <= 76) mask[p] = 1;
  }
  dilate(mask);

  const blobs = findBlobs(mask);
  lastBlobs = blobs; lastMask = mask;

  let best = null, bestScore = 0;
  for (const b of blobs) {
    let score = blobScore(b, lum);
    if (score > 0) {
      const hist = histFromBlob(b, mask);
      const ls = learnedScore(hist);
      if (ls !== null) {
        if (ls < 0.15 && learn.neg.length > 0) score = 0;
        else score *= (0.25 + 1.5 * ls);
      }
    }
    b.score = score;
    if (score > bestScore) { bestScore = score; best = b; }
  }
  bestBlob = best;

  emaScore = emaScore * (1 - EMA_ALPHA) + bestScore * EMA_ALPHA;

  rawVotes.push(!!best);
  if (rawVotes.length > 5) rawVotes.shift();
  const rawHits = rawVotes.filter(Boolean).length;

  if (best && prevCx >= 0 && Math.hypot(best.cx - prevCx, best.cy - prevCy) > W / 2.5) {
    emaScore = bestScore; rawVotes.length = 0;
  }
  if (best) { prevCx = best.cx; prevCy = best.cy; }

  const now = Date.now();
  if (emaScore >= TRIGGER_EMA && rawHits >= RAW_HITS && now - lastAlarm > COOLDOWN_MS) {
    lastAlarm = now;
    setAlarm(true);
  }
  if (emaScore < TRIGGER_EMA * 0.5) setAlarm(false);

  if (best) { statusEl.textContent = '🐤 Канарейка обнаружена!'; statusEl.classList.add('found'); }
  else {
    statusEl.classList.remove('found');
    if (!alarmActive) statusEl.textContent = 'Канарейки не видно';
    else statusEl.textContent = '🐤 Канарейка (уходит из кадра)';
  }

  debugEl.textContent =
    (blobs.length
      ? `пятен: ${blobs.length}, оценка ${best ? (bestScore * 100 | 0) : 0}, сыр ${rawHits}/5, сглаж ${emaScore.toFixed(2)}, свет ${lum.toFixed(2)}`
      : `жёлтого нет (свет ${lum.toFixed(2)})`)
    + ` — обучение: ✓${learn.pos.length} ✗${learn.neg.length}`;

  drawOverlay();
}
</script>
