<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Детектор канарейки 🐤</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  body {
    background: #111; color: #eee;
    display: flex; flex-direction: column; align-items: center;
    font-family: system-ui, sans-serif; min-height: 100vh;
  }
  .camwrap { position: relative; width: 100%; max-width: 480px; }
  #video { width: 100%; display: block; border-radius: 8px; background: #000; }
  #overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
    -webkit-user-select: none; user-select: none;
  }
  #status {
    font-size: 1em; margin: 8px; padding: 10px 14px;
    border-radius: 12px; background: #222; text-align: center;
  }
  #status.found { background: #1b5e20; }
  #status.alarm { background: #7f1d1d; }
  #debug {
    color: #999; font-size: .72em; margin: 4px;
    text-align: center; line-height: 1.4;
  }
  #panel {
    display: flex; gap: 8px; margin: 6px; flex-wrap: wrap;
    justify-content: center; max-width: 600px;
  }
  button {
    font-size: .92em; padding: 10px 14px; border: 0;
    border-radius: 20px; background: #ffd54f; color: #222;
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.off { background: #444; color: #aaa; }
  #sensWrap {
    display: flex; align-items: center; gap: 10px; margin: 6px 10px;
    font-size: .9em; color: #ccc; width: 100%; max-width: 480px;
  }
  #sensWrap input { flex: 1; accent-color: #ffd54f; }

  .modal {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.94);
    flex-direction: column; align-items: center; padding: 12px;
    overflow-y: auto;
  }
  .modal.open { display: flex; }
  #trainCanvas {
    max-width: 100%; max-height: 55vh;
    touch-action: none; border-radius: 6px;
    background: #000;
  }
  #trainHint {
    margin: 10px; text-align: center; color: #ccc;
    font-size: .9em; max-width: 600px;
  }
  #trainBtns {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; margin-bottom: 10px;
  }
  #trainBtns .ok { background: #4caf50; color: #fff; }
  #trainBtns .no { background: #f44336; color: #fff; }
  #libModal h3 { margin: 12px 0 6px; text-align: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .cell { text-align: center; }
  .cell img {
    width: 96px; height: 96px; object-fit: cover;
    border-radius: 6px; border: 2px solid #555;
  }
  .cell .cap {
    font-size: .65em; color: #999; max-width: 96px;
    overflow: hidden;
  }
  .empty { color: #777; font-size: .9em; margin: 8px; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 18px;
    border-radius: 20px; opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 40; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="camwrap" id="camwrap">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div id="status">Нажмите «Запустить камеру»</div>
<div id="debug"></div>

<div id="sensWrap">
  <span>Чувствительность</span>
  <input type="range" id="sens" min="0" max="100" value="50">
  <span id="sensVal">50</span>
</div>

<div id="panel">
  <button id="btn">▶ Запустить камеру</button>
  <button id="flip">📷 Сменить камеру</button>
  <button id="sound" class="off">🔇 Звук: выкл</button>
  <button id="libBtn">📚 Библиотека</button>
  <button id="photo">🖼 Обучить по фото</button>
  <button id="dsExport">⬇ Скачать набор</button>
  <button id="dsImport">⬆ Загрузить набор</button>
  <button id="forget">🗑 Забыть обучение</button>
</div>

<div id="trainModal" class="modal">
  <div id="trainHint">Обведите канарейку, затем нажмите «✓ В контуре канарейка».</div>
  <canvas id="trainCanvas"></canvas>
  <div id="trainBtns">
    <button class="ok" id="trainPos">✓ В контуре канарейка</button>
    <button class="no" id="trainNeg">✗ Канарейки нет</button>
    <button id="trainPan">✋ Сдвинуть</button>
    <button id="trainUndo">↩ Точку назад</button>
    <button id="trainClear">↺ Стереть контур</button>
    <button id="trainZoomIn">🔍+</button>
    <button id="trainZoomOut">🔍−</button>
    <button id="trainClose">Закрыть</button>
  </div>
</div>

<div id="libModal" class="modal">
  <h3>📚 Снимки при срабатываниях</h3>
  <div class="grid" id="snapGrid"></div>
  <h3>✓ Примеры «канарейка»</h3>
  <div class="grid" id="posGrid"></div>
  <h3>✗ Примеры «не канарейка»</h3>
  <div class="grid" id="negGrid"></div>
  <button id="libClose" style="margin:16px">Закрыть</button>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="dsFile" accept=".json,application/json" hidden>

<script>
'use strict';

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const camwrap = document.getElementById('camwrap');
const octx = overlay.getContext('2d');
const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');
const btn = document.getElementById('btn');
const flipBtn = document.getElementById('flip');
const soundBtn = document.getElementById('sound');
const toastEl = document.getElementById('toast');
const sensEl = document.getElementById('sens');
const sensValEl = document.getElementById('sensVal');

const W = 240, H = 180, N = W * H;
const INTERVAL_MS = 800;
const EMA_ALPHA = 0.55;
const BG_ALPHA = 0.045;
const MOTION_ALPHA = 0.30;
const MOTION_THR = 40;
const COOLDOWN_MS = 8000;
const TAP_RADIUS = 10;
const HOLD_MS = 600;
const MAX_SAMPLES = 25;
const MAX_SNAPS = 20;
const DILATE_PASSES = 2;
const MERGE_PAD = 4;

let triggerEMA = 0.225;
let running = false;
let facing = 'environment';
let mirror = false;
let soundOn = false;
let alarmActive = false;
let lastAlarm = 0;
let emaScore = 0;
let warmupFrames = 0;
let framesProcessed = 0;
let prevCx = -1, prevCy = -1;
let analysisTimer = null;
let streamGeneration = 0;
let cameraBusy = false;

const avgR = new Float32Array(N);
const avgG = new Float32Array(N);
const avgB = new Float32Array(N);
const bgR = new Float32Array(N);
const bgG = new Float32Array(N);
const bgB = new Float32Array(N);
const motionEMA = new Float32Array(N);
const lumBuf = new Float32Array(N);
const gradBuf = new Float32Array(N);

let buffersReady = false;
let lastBlobs = [];
let lastMask = new Uint8Array(N);
let bestBlob = null;
let rawVotes = [];
let flashUntil = 0, flashBox = null, flashColor = '#4f4', flashPoint = null;
let press = null;
let holdRaf = null;

const workCanvas = document.createElement('canvas');
workCanvas.width = W;
workCanvas.height = H;
const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

const snapCanvas = document.createElement('canvas');
const snapCtx = snapCanvas.getContext('2d');

const LEARN_KEY = 'canary_learn_v4';
const PREFS_KEY = 'canary_prefs_v4';
const SNAPS_KEY = 'canary_snaps_v4';

function loadJSON(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value == null ? fallback : value;
  } catch {
    return fallback;
  }
}
function safeSave(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    showToast('Не удалось сохранить: память браузера заполнена');
    return false;
  }
}

let learn = loadJSON(LEARN_KEY, { pos: [], neg: [] });
if (!learn || !Array.isArray(learn.pos) || !Array.isArray(learn.neg)) {
  learn = { pos: [], neg: [] };
}
let snaps = loadJSON(SNAPS_KEY, []);
if (!Array.isArray(snaps)) snaps = [];

const prefs = loadJSON(PREFS_KEY, {});
if (typeof prefs.soundOn === 'boolean') soundOn = prefs.soundOn;
if (prefs.facing === 'user' || prefs.facing === 'environment') facing = prefs.facing;
let sensitivity = Number.isFinite(prefs.sensitivity) ? prefs.sensitivity : 50;
sensitivity = Math.max(0, Math.min(100, sensitivity));

function savePrefs() {
  safeSave(PREFS_KEY, { soundOn, facing, sensitivity });
}
function saveLearn() { safeSave(LEARN_KEY, learn); }
function saveSnaps() { safeSave(SNAPS_KEY, snaps); }

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}
function applySensitivity() {
  sensValEl.textContent = sensitivity;
  sensEl.value = sensitivity;
  triggerEMA = 0.35 - sensitivity / 100 * 0.25;
}
applySensitivity();
sensEl.addEventListener('input', () => {
  sensitivity = Number(sensEl.value);
  applySensitivity();
  savePrefs();
});

function applyMirror() {
  mirror = facing === 'user';
  camwrap.style.transform = mirror ? 'scaleX(-1)' : 'none';
}
applyMirror();

function resetDetectionState() {
  emaScore = 0;
  rawVotes = [];
  prevCx = prevCy = -1;
  lastBlobs = [];
  bestBlob = null;
  lastMask.fill(0);
  alarmActive = false;
  clearAlarmTimer();
  octx.clearRect(0, 0, overlay.width, overlay.height);
}
function clearBuffers() {
  avgR.fill(0); avgG.fill(0); avgB.fill(0);
  bgR.fill(0); bgG.fill(0); bgB.fill(0);
  motionEMA.fill(0);
  buffersReady = false;
  framesProcessed = 0;
  warmupFrames = 4;
  resetDetectionState();
}

// Audio
let audioCtx = null;
let alarmTimer = null;

function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {}
}
document.body.addEventListener('pointerdown', unlockAudio, { passive: true });

function tone(freq, duration, volume, delay = 0) {
  if (!soundOn || !audioCtx || audioCtx.state !== 'running') return false;
  try {
    const start = audioCtx.currentTime + delay / 1000;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration / 1000);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + duration / 1000 + 0.05);
    return true;
  } catch {
    return false;
  }
}
function chirp() {
  if (!soundOn) return;
  const success =
    tone(1100, 110, 0.35, 0) &&
    tone(1350, 110, 0.35, 140) &&
    tone(1600, 200, 0.35, 280);
  if (!success && navigator.vibrate) navigator.vibrate([120, 80, 120]);
}
function clearAlarmTimer() {
  if (alarmTimer) clearInterval(alarmTimer);
  alarmTimer = null;
}
function setAlarm(on) {
  if (on === alarmActive) return;
  alarmActive = on;
  if (on) {
    chirp();
    alarmTimer = setInterval(chirp, 1100);
  } else {
    clearAlarmTimer();
  }
}
soundBtn.textContent = soundOn ? '🔊 Звук: вкл' : '🔇 Звук: выкл';
soundBtn.classList.toggle('off', !soundOn);
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊 Звук: вкл' : '🔇 Звук: выкл';
  soundBtn.classList.toggle('off', !soundOn);
  savePrefs();
  unlockAudio();
  if (soundOn) chirp();
  else clearAlarmTimer();
});

// Color lookup table for learned palettes
const LUT_SIZE = 4096;
const posLUT = new Uint8Array(LUT_SIZE);
const negLUT = new Uint8Array(LUT_SIZE);

function lutIndex(r, g, b) {
  return ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
}
function markLUT(lut, r, g, b) {
  const ri = r >> 4, gi = g >> 4, bi = b >> 4;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dg = -1; dg <= 1; dg++) {
      for (let db = -1; db <= 1; db++) {
        const rr = ri + dr, gg = gi + dg, bb = bi + db;
        if (rr >= 0 && rr < 16 && gg >= 0 && gg < 16 && bb >= 0 && bb < 16) {
          lut[(rr << 8) | (gg << 4) | bb] = 1;
        }
      }
    }
  }
}
function rebuildLUTs() {
  posLUT.fill(0);
  negLUT.fill(0);
  for (const sample of learn.pos) {
    if (Array.isArray(sample.pal)) {
      for (const c of sample.pal) markLUT(posLUT, c[0], c[1], c[2]);
    }
  }
  for (const sample of learn.neg) {
    if (Array.isArray(sample.pal)) {
      for (const c of sample.pal) markLUT(negLUT, c[0], c[1], c[2]);
    }
  }
}
function extractPalette(pixels, count = 6) {
  if (!pixels.length) return [];
  const counts = new Uint16Array(LUT_SIZE);
  for (const px of pixels) counts[lutIndex(px[0] | 0, px[1] | 0, px[2] | 0)]++;
  const order = [];
  for (let i = 0; i < LUT_SIZE; i++) {
    if (counts[i]) order.push([i, counts[i]]);
  }
  order.sort((a, b) => b[1] - a[1]);
  return order.slice(0, count).map(([i]) => [
    (((i >> 8) & 15) << 4) + 8,
    (((i >> 4) & 15) << 4) + 8,
    ((i & 15) << 4) + 8
  ]);
}

// Histograms
const HBINS = 12, SBINS = 3, VBINS = 3;
const HBIN_SIZE = HBINS * SBINS * VBINS;

function hsvOf(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const v = max / 255;
  const s = max === 0 ? 0 : (max - min) / max;
  let h = 0;
  if (max !== min) {
    const d = max - min;
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
    else if (max === g) h = ((b - r) / d + 2) * 60;
    else h = ((r - g) / d + 4) * 60;
  }
  return [h, s, v];
}
function buildHist(pixels) {
  const hist = new Float32Array(HBIN_SIZE);
  let count = 0;
  for (const px of pixels) {
    const [h, s, v] = hsvOf(px[0], px[1], px[2]);
    if (s <= 0.12 || v <= 0.12) continue;
    const hi = Math.min(HBINS - 1, (h / 30) | 0);
    const si = Math.min(SBINS - 1, (s * SBINS) | 0);
    const vi = Math.min(VBINS - 1, (v * VBINS) | 0);
    hist[hi * SBINS * VBINS + si * VBINS + vi]++;
    count++;
  }
  if (!count) return null;
  for (let i = 0; i < hist.length; i++) hist[i] /= count;
  return hist;
}
function sim(a, b) {
  let score = 0;
  for (let i = 0; i < a.length; i++) score += Math.min(a[i], b[i]);
  return score;
}
function learnedScore(hist) {
  if (!hist) return null;
  if (!learn.pos.length && !learn.neg.length) return null;
  // Если позитивов ещё нет — негативы только мягко штрафуют, а не убивают пятно.
  if (!learn.pos.length) {
    let negBest = 0;
    for (const sample of learn.neg) {
      if (sample.hist) negBest = Math.max(negBest, sim(hist, sample.hist));
    }
    return Math.max(0, Math.min(1, 1 - negBest * 1.5));
  }
  let posBest = 0, negBest = 0;
  for (const sample of learn.pos) {
    if (sample.hist) posBest = Math.max(posBest, sim(hist, sample.hist));
  }
  for (const sample of learn.neg) {
    if (sample.hist) negBest = Math.max(negBest, sim(hist, sample.hist));
  }
  return Math.max(0, Math.min(1, 0.5 + (posBest - negBest) * 1.2));
}
function histFromBlob(blob, mask) {
  const pixels = [];
  for (let y = blob.minY; y <= blob.maxY; y++) {
    for (let x = blob.minX; x <= blob.maxX; x++) {
      const p = y * W + x;
      if (mask[p]) pixels.push([avgR[p], avgG[p], avgB[p]]);
    }
  }
  return buildHist(pixels);
}
function histFromTap(gx, gy) {
  const pixels = [];
  for (let y = Math.max(0, gy - TAP_RADIUS); y <= Math.min(H - 1, gy + TAP_RADIUS); y++) {
    for (let x = Math.max(0, gx - TAP_RADIUS); x <= Math.min(W - 1, gx + TAP_RADIUS); x++) {
      const p = y * W + x;
      pixels.push([avgR[p], avgG[p], avgB[p]]);
    }
  }
  return buildHist(pixels);
}
function paletteFromRegion(x0, y0, x1, y1, mask) {
  const pixels = [];
  for (let y = y0; y <= y1; y += 2) {
    for (let x = x0; x <= x1; x += 2) {
      const p = y * W + x;
      if (mask && !mask[p]) continue;
      pixels.push([avgR[p] | 0, avgG[p] | 0, avgB[p] | 0]);
    }
  }
  return extractPalette(pixels, 6);
}
function thumbFromCells(x0, y0, x1, y1, mask, size = 64) {
  snapCanvas.width = size;
  snapCanvas.height = size;
  snapCtx.fillStyle = '#000';
  snapCtx.fillRect(0, 0, size, size);
  const cw = Math.max(1, (size / (x1 - x0 + 1)) | 0);
  const ch = Math.max(1, (size / (y1 - y0 + 1)) | 0);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const p = y * W + x;
      if (mask && !mask[p]) continue;
      snapCtx.fillStyle = `rgb(${avgR[p] | 0},${avgG[p] | 0},${avgB[p] | 0})`;
      snapCtx.fillRect((x - x0) * cw, (y - y0) * ch, cw, ch);
    }
  }
  return snapCanvas.toDataURL('image/jpeg', 0.55);
}
function addLearn(isPositive, hist, thumb, palette) {
  const arr = isPositive ? learn.pos : learn.neg;
  arr.push({ hist: Array.from(hist), thumb, pal: palette || null });
  if (arr.length > MAX_SAMPLES) arr.shift();
  saveLearn();
  rebuildLUTs();
}

// Camera management
function stopStream() {
  if (video.srcObject) {
    for (const track of video.srcObject.getTracks()) track.stop();
    video.srcObject = null;
  }
}
function friendlyCameraError(error) {
  if (!window.isSecureContext) {
    return 'Камера требует HTTPS или localhost.';
  }
  if (error && error.name === 'NotAllowedError') return 'Доступ запрещён. Разрешите камеру в настройках сайта.';
  if (error && error.name === 'NotFoundError') return 'Камера не найдена.';
  if (error && error.name === 'NotReadableError') return 'Камера занята другим приложением.';
  return 'Не удалось открыть камеру: ' + (error?.message || error || 'неизвестная ошибка');
}
async function openStream() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error('Браузер не поддерживает камеру. Используйте современный браузер и HTTPS.');
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: facing },
      width: { ideal: 640 },
      height: { ideal: 480 },
      frameRate: { ideal: 10, max: 15 }
    },
    audio: false
  });
  video.srcObject = stream;
  await new Promise((resolve, reject) => {
    if (video.readyState >= 2) return resolve();
    const onLoaded = () => { clean(); resolve(); };
    const onError = () => { clean(); reject(new Error('Не удалось прочитать видео с камеры.')); };
    const clean = () => {
      video.removeEventListener('loadeddata', onLoaded);
      video.removeEventListener('error', onError);
    };
    video.addEventListener('loadeddata', onLoaded, { once: true });
    video.addEventListener('error', onError, { once: true });
  });
  await video.play();
}
async function startCamera() {
  if (cameraBusy || running) return;
  cameraBusy = true;
  btn.disabled = true;
  btn.textContent = '▶ Запускаю…';
  statusEl.textContent = 'Запрашиваю доступ к камере…';
  try {
    await openStream();
    clearBuffers();
    running = true;
    streamGeneration++;
    if (analysisTimer) clearInterval(analysisTimer);
    analysisTimer = setInterval(analyze, INTERVAL_MS);
    btn.textContent = '⏹ Остановить камеру';
    statusEl.textContent = 'Камера работает. Тап по рамке — «канарейка», удержание — «не канарейка».';
  } catch (error) {
    stopStream();
    running = false;
    btn.textContent = '▶ Запустить камеру';
    statusEl.textContent = friendlyCameraError(error);
  } finally {
    cameraBusy = false;
    btn.disabled = false;
  }
}
function stopCamera() {
  running = false;
  streamGeneration++;
  if (analysisTimer) clearInterval(analysisTimer);
  analysisTimer = null;
  stopStream();
  resetDetectionState();
  btn.textContent = '▶ Запустить камеру';
  statusEl.textContent = 'Камера остановлена';
  debugEl.textContent = '';
}
btn.addEventListener('click', () => running ? stopCamera() : startCamera());

flipBtn.textContent = facing === 'user' ? '🤳 Фронтальная камера' : '📷 Сменить камеру';
flipBtn.addEventListener('click', async () => {
  if (cameraBusy) return;
  const wasRunning = running;
  if (wasRunning) stopCamera();
  facing = facing === 'environment' ? 'user' : 'environment';
  flipBtn.textContent = facing === 'user' ? '🤳 Фронтальная камера' : '📷 Сменить камеру';
  applyMirror();
  savePrefs();
  clearBuffers();
  if (wasRunning) await startCamera();
  else showToast('Камера изменена. Запустите камеру.');
});
video.addEventListener('loadedmetadata', () => {

// Pointer training from live camera
function flashRect(blob, color) {
  flashBox = blob; flashPoint = null; flashColor = color;
  flashUntil = Date.now() + 1200;
}
function flashTap(x, y, color) {
  flashPoint = [x, y]; flashBox = null; flashColor = color;
  flashUntil = Date.now() + 1200;
}

// Тап теперь «умный»: точное пятно → ближайшее пятно → локальный кластер маски.
function blobFromCluster(gx, gy) {
  const R = 14;
  let count = 0, minX = W, maxX = 0, minY = H, maxY = 0;
  let sumMot = 0, sumGrad = 0;
  for (let y = Math.max(0, gy - R); y <= Math.min(H - 1, gy + R); y++) {
    for (let x = Math.max(0, gx - R); x <= Math.min(W - 1, gx + R); x++) {
      const p = y * W + x;
      if (!lastMask[p]) continue;
      count++;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      sumMot += motionEMA[p];
      sumGrad += gradBuf[p];
    }
  }
  if (count < 15) return null;
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  return {
    size: count,
    fill: count / (bw * bh),
    ratio: Math.max(bw, bh) / Math.max(1, Math.min(bw, bh)),
    cx: gx, cy: gy,
    minX, maxX, minY, maxY,
    motionAvg: sumMot / count,
    gradAvg: sumGrad / count,
    score: 0, ls: null
  };
}
function findTapTarget(gx, gy) {
  let best = null, bestD = Infinity;
  for (const b of lastBlobs) {
    if (b.size < 4) continue;
    const dx = Math.max(b.minX - gx, 0, gx - b.maxX);
    const dy = Math.max(b.minY - gy, 0, gy - b.maxY);
    if (dx === 0 && dy === 0) return b; // тап внутри пятна
    const d = Math.hypot(dx, dy);
    if (d <= 12 && d < bestD) { bestD = d; best = b; }
  }
  return best || blobFromCluster(gx, gy);
}

overlay.addEventListener('contextmenu', e => e.preventDefault());
overlay.addEventListener('pointerdown', e => {
  if (!running || !buffersReady || !overlay.width) return;
  const rect = overlay.getBoundingClientRect();
  // В зеркальном режиме экранные координаты инвертируются.
  const sx = mirror
    ? (rect.right - e.clientX) / rect.width * W
    : (e.clientX - rect.left) / rect.width * W;
  const gx = Math.max(0, Math.min(W - 1, Math.floor(sx)));
  const gy = Math.max(0, Math.min(H - 1, Math.floor((e.clientY - rect.top) / rect.height * H)));
  const hit = findTapTarget(gx, gy);
  press = { gx, gy, hit, t0: Date.now(), longDone: false };
  overlay.setPointerCapture(e.pointerId);
  const tick = () => {
    if (!press) { holdRaf = null; return; }
    drawOverlay();
    holdRaf = requestAnimationFrame(tick);
  };
  holdRaf = requestAnimationFrame(tick);
});
function endPress() {
  if (!press) return;
  const { gx, gy, hit, t0, longDone } = press;
  press = null;
  if (holdRaf) cancelAnimationFrame(holdRaf);
  holdRaf = null;
  const held = longDone || Date.now() - t0 >= HOLD_MS;

  if (held) {
    if (hit) {
      const hist = histFromBlob(hit, lastMask);
      if (!hist) return showToast('Недостаточно цвета для обучения');
      addLearn(false, hist,
        thumbFromCells(hit.minX, hit.minY, hit.maxX, hit.maxY, lastMask),
        paletteFromRegion(hit.minX, hit.minY, hit.maxX, hit.maxY, lastMask));
      showToast('✗ Запомнил как «не канарейка»');
      flashRect(hit, '#f44');
    } else {
      const hist = histFromTap(gx, gy);
      if (!hist) return showToast('Недостаточно цвета для обучения');
      const x0 = Math.max(0, gx - TAP_RADIUS), x1 = Math.min(W - 1, gx + TAP_RADIUS);
      const y0 = Math.max(0, gy - TAP_RADIUS), y1 = Math.min(H - 1, gy + TAP_RADIUS);
      addLearn(false, hist, thumbFromCells(x0, y0, x1, y1, null),
        paletteFromRegion(x0, y0, x1, y1, null));
      showToast('✗ Запомнил как «не канарейка»');
      flashTap(gx, gy, '#f44');
    }
    return;
  }

  if (hit) {
    const hist = histFromBlob(hit, lastMask);
    if (!hist) return showToast('Недостаточно цвета для обучения');
    addLearn(true, hist,
      thumbFromCells(hit.minX, hit.minY, hit.maxX, hit.maxY, lastMask),
      paletteFromRegion(hit.minX, hit.minY, hit.maxX, hit.maxY, lastMask));
    showToast('✓ Запомнил как канарейку');
    flashRect(hit, '#4f4');
  } else {
    flashTap(gx, gy, '#888');
    showToast('Здесь нет цвета птицы. Тапайте по жёлтым пятнам, показанным рамками.');
  }
}

  press = null;
  if (holdRaf) cancelAnimationFrame(holdRaf);
  holdRaf = null;
});

// Photo training with zoom / pan / point editing
const trainModal = document.getElementById('trainModal');
const trainCanvas = document.getElementById('trainCanvas');
const trainCtx = trainCanvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const trainHint = document.getElementById('trainHint');
const trainPanBtn = document.getElementById('trainPan');
let photoQueue = [], trainImg = null, drawPath = [], isDrawing = false;
let panMode = false;
let trainView = { s: 1, ox: 0, oy: 0 };
let panStart = null;
let pinch = null;
let dragPoint = -1;
let drawPointerId = null;
const pointers = new Map();

document.getElementById('photo').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  photoQueue = Array.from(fileInput.files || []);
  fileInput.value = '';
  nextPhoto();
});
function nextPhoto() {
  if (!photoQueue.length) {
    trainModal.classList.remove('open');
    return;
  }
  const file = photoQueue.shift();
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    trainImg = img;
    const scale = Math.min(1, 640 / img.width);
    trainCanvas.width = Math.max(1, Math.round(img.width * scale));
    trainCanvas.height = Math.max(1, Math.round(img.height * scale));
    trainView = { s: 1, ox: 0, oy: 0 };
    drawPath = [];
    isDrawing = false;
    redrawTrainCanvas();
    trainHint.textContent = `Осталось фото: ${photoQueue.length}. Обведите канарейку: палец по точке — двигать её, тап мимо точек — добавить новую. Пинч — зум, «Сдвинуть» — панорама.`;
    trainModal.classList.add('open');
    URL.revokeObjectURL(url);
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    showToast('Не удалось открыть фотографию');
    nextPhoto();
  };
  img.src = url;
}
function trainCoords(e) {
  const r = trainCanvas.getBoundingClientRect();
  return [
    (e.clientX - r.left) * trainCanvas.width / r.width,
    (e.clientY - r.top) * trainCanvas.height / r.height
  ];
}
function clampTrainView() {
  const cw = trainCanvas.width, ch = trainCanvas.height;
  trainView.s = Math.max(1, Math.min(8, trainView.s));
  trainView.ox = Math.min(0, Math.max(cw - cw * trainView.s, trainView.ox));
  trainView.oy = Math.min(0, Math.max(ch - ch * trainView.s, trainView.oy));
  if (trainView.s === 1) { trainView.ox = 0; trainView.oy = 0; }
}
function hitPoint(cx, cy) {
  const r = Math.max(16, 20 / trainView.s);
  for (let i = 0; i < drawPath.length; i++) {
    if (Math.hypot(drawPath[i][0] - cx, drawPath[i][1] - cy) <= r) return i;
  }
  return -1;
}
function redrawTrainCanvas() {
  if (!trainImg) return;
  const cw = trainCanvas.width, ch = trainCanvas.height;
  trainCtx.setTransform(1, 0, 0, 1, 0, 0);
  trainCtx.fillStyle = '#000';
  trainCtx.fillRect(0, 0, cw, ch);
  trainCtx.save();
  trainCtx.translate(trainView.ox, trainView.oy);
  trainCtx.scale(trainView.s, trainView.s);
  trainCtx.drawImage(trainImg, 0, 0, cw, ch);
  if (drawPath.length) {
    const lw = 3 / trainView.s;
    if (drawPath.length >= 3) {
      trainCtx.fillStyle = 'rgba(76,175,80,.25)';
      trainCtx.beginPath();
      trainCtx.moveTo(...drawPath[0]);
      for (let i = 1; i < drawPath.length; i++) trainCtx.lineTo(...drawPath[i]);
      trainCtx.closePath();
      trainCtx.fill();
    }
    trainCtx.strokeStyle = '#4f4';
    trainCtx.lineWidth = lw;
    trainCtx.lineJoin = 'round';
    trainCtx.lineCap = 'round';
    trainCtx.beginPath();
    trainCtx.moveTo(...drawPath[0]);
    for (let i = 1; i < drawPath.length; i++) trainCtx.lineTo(...drawPath[i]);
    if (!isDrawing && drawPath.length >= 3) trainCtx.closePath();
    trainCtx.stroke();
    trainCtx.fillStyle = '#fff';
    trainCtx.strokeStyle = '#2c2';
    trainCtx.lineWidth = lw;
    const pr = Math.max(3, 5 / trainView.s);
    for (const p of drawPath) {
      trainCtx.beginPath();
      trainCtx.arc(p[0], p[1], pr, 0, Math.PI * 2);
      trainCtx.fill();
      trainCtx.stroke();
    }
  }
  trainCtx.restore();
}
trainCanvas.addEventListener('pointerdown', e => {
  if (!trainImg) return;
  trainCanvas.setPointerCapture(e.pointerId);
  const [cx, cy] = trainCoords(e);
  pointers.set(e.pointerId, { x: cx, y: cy });
  if (pointers.size === 2) {
    isDrawing = false;
    dragPoint = -1;
    const [p1, p2] = [...pointers.values()];
    pinch = { d: Math.max(1, Math.hypot(p1.x - p2.x, p1.y - p2.y)), s: trainView.s, ox: trainView.ox, oy: trainView.oy };
    redrawTrainCanvas();
    return;
  }
  if (panMode) {
    panStart = { x: cx, y: cy, ox: trainView.ox, oy: trainView.oy };
    return;
  }
  const idx = hitPoint(cx, cy);
  if (idx >= 0) {
    dragPoint = idx;
  } else {
    drawPath.push([cx, cy]);
    isDrawing = true;
    drawPointerId = e.pointerId;
  }
  redrawTrainCanvas();
});
trainCanvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const [cx, cy] = trainCoords(e);
  const entry = pointers.get(e.pointerId);
  entry.x = cx; entry.y = cy;
  if (pinch && pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    const d = Math.max(1, Math.hypot(p1.x - p2.x, p1.y - p2.y));
    const ns = Math.max(1, Math.min(8, pinch.s * d / pinch.d));
    const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
    trainView.ox = midX - (midX - pinch.ox) * ns / pinch.s;
    trainView.oy = midY - (midY - pinch.oy) * ns / pinch.s;
    trainView.s = ns;
    clampTrainView();
    redrawTrainCanvas();
    return;
  }
  if (dragPoint >= 0) {
    drawPath[dragPoint] = [cx, cy];
    redrawTrainCanvas();
    return;
  }
  if (panMode && panStart) {
    trainView.ox = panStart.ox + (cx - panStart.x);
    trainView.oy = panStart.oy + (cy - panStart.y);
    clampTrainView();
    redrawTrainCanvas();
    return;
  }
  if (isDrawing && e.pointerId === drawPointerId) {
    const last = drawPath[drawPath.length - 1];
    if (last && Math.hypot(cx - last[0], cy - last[1]) > 2.5 / trainView.s) {
      drawPath.push([cx, cy]);
      redrawTrainCanvas();
    }
  }
});
function trainEnd(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (e.pointerId === drawPointerId) { isDrawing = false; drawPointerId = null; }
  dragPoint = -1;
  panStart = null;
  redrawTrainCanvas();
}
trainCanvas.addEventListener('pointerup', trainEnd);
trainCanvas.addEventListener('pointercancel', trainEnd);

trainPanBtn.addEventListener('click', () => {
  panMode = !panMode;
  trainPanBtn.textContent = panMode ? '✏️ Рисовать' : '✋ Сдвинуть';
  trainPanBtn.classList.toggle('off', panMode);
});
function zoomTrainBy(factor, cx, cy) {
  const cw = trainCanvas.width, ch = trainCanvas.height;
  cx = cx == null ? cw / 2 : cx;
  cy = cy == null ? ch / 2 : cy;
  const ns = Math.max(1, Math.min(8, trainView.s * factor));
  trainView.ox = cx - (cx - trainView.ox) * ns / trainView.s;
  trainView.oy = cy - (cy - trainView.oy) * ns / trainView.s;
  trainView.s = ns;
  clampTrainView();
  redrawTrainCanvas();
}
document.getElementById('trainUndo').addEventListener('click', () => {
  if (drawPath.length) { drawPath.pop(); redrawTrainCanvas(); }
});
document.getElementById('trainZoomIn').addEventListener('click', () => zoomTrainBy(1.4));
document.getElementById('trainZoomOut').addEventListener('click', () => zoomTrainBy(1 / 1.4));
document.getElementById('trainClear').addEventListener('click', () => {
  drawPath = [];
  isDrawing = false;
  redrawTrainCanvas();
});
document.getElementById('trainClose').addEventListener('click', () => {
  photoQueue = [];
  drawPath = [];
  isDrawing = false;
  trainModal.classList.remove('open');
});

function imagePixels(canvas, step, maskData = null) {
  const pixels = [];
  const data = canvas.getContext('2d', { willReadFrequently: true })
    .getImageData(0, 0, canvas.width, canvas.height).data;
  for (let y = 0; y < canvas.height; y += step) {
    for (let x = 0; x < canvas.width; x += step) {
      const i = (y * canvas.width + x) * 4;
      if (maskData && maskData[i] === 0) continue;
      pixels.push([data[i], data[i + 1], data[i + 2]]);
    }
  }
  return pixels;
}
function saveFromPhoto(isPositive) {
  if (!trainImg) return;
  const cw = trainCanvas.width, ch = trainCanvas.height;
  const clean = document.createElement('canvas');
  clean.width = cw; clean.height = ch;
  const cctx = clean.getContext('2d', { willReadFrequently: true });
  cctx.drawImage(trainImg, 0, 0, cw, ch);

  if (!isPositive) {
    const pixels = imagePixels(clean, 3);
    const hist = buildHist(pixels);
    if (!hist) return showToast('Не получилось извлечь цвета');
    snapCanvas.width = 64;
    snapCanvas.height = Math.max(1, Math.round(ch / cw * 64));
    snapCtx.drawImage(clean, 0, 0, snapCanvas.width, snapCanvas.height);
    addLearn(false, hist, snapCanvas.toDataURL('image/jpeg', .55), extractPalette(pixels));
    showToast('✗ Фон сохранён как отрицательный пример');
    nextPhoto();
    return;
  }

  if (drawPath.length < 3) return showToast('Обведите канарейку минимум тремя точками');

  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = cw; maskCanvas.height = ch;
  const mctx = maskCanvas.getContext('2d', { willReadFrequently: true });
  mctx.fillStyle = '#fff';
  mctx.beginPath();
  mctx.moveTo(...drawPath[0]);
  for (let i = 1; i < drawPath.length; i++) mctx.lineTo(...drawPath[i]);
  mctx.closePath();
  mctx.fill();
  const maskData = mctx.getImageData(0, 0, cw, ch).data;
  const pixels = imagePixels(clean, 2, maskData);
  if (pixels.length < 30) return showToast('Контур слишком маленький');

  const hist = buildHist(pixels);
  if (!hist) return showToast('Не получилось извлечь цвета');

  const xs = drawPath.map(p => p[0]), ys = drawPath.map(p => p[1]);
  const minX = Math.max(0, Math.floor(Math.min(...xs)));
  const minY = Math.max(0, Math.floor(Math.min(...ys)));
  const maxX = Math.min(cw, Math.ceil(Math.max(...xs)));
  const maxY = Math.min(ch, Math.ceil(Math.max(...ys)));
  if (maxX - minX < 15 || maxY - minY < 15) return showToast('Контур слишком мелкий');

  const thumb = document.createElement('canvas');
  thumb.width = 64;
  thumb.height = Math.max(1, Math.round((maxY - minY) / (maxX - minX) * 64));
  const tctx = thumb.getContext('2d');
  tctx.drawImage(clean, minX, minY, maxX - minX, maxY - minY, 0, 0, thumb.width, thumb.height);
  addLearn(true, hist, thumb.toDataURL('image/jpeg', .55), extractPalette(pixels));
  showToast('✓ Канарейка сохранена');
  drawPath = [];
  nextPhoto();
}
document.getElementById('trainPos').addEventListener('click', () => saveFromPhoto(true));
document.getElementById('trainNeg').addEventListener('click', () => saveFromPhoto(false));

const libModal = document.getElementById('libModal');

function renderEmpty(grid, text) {

  el.className = 'empty';
  el.textContent = text;
  grid.appendChild(el);
}
function renderCell(grid, sample, caption, onDelete) {
  const cell = document.createElement('div');
  cell.className = 'cell';

  img.src = sample;
  img.alt = caption;

  cap.textContent = caption;
  cell.append(img, cap);

function renderLibrary() {
  snapGrid.replaceChildren();
  posGrid.replaceChildren();
  negGrid.replaceChildren();

  if (!snaps.length) renderEmpty(snapGrid, 'Снимков пока нет');
  else snaps.slice().reverse().forEach((s, reverseIndex) => {
    const originalIndex = snaps.length - 1 - reverseIndex;
    renderCell(snapGrid, s.img, new Date(s.t).toLocaleTimeString('ru-RU'), () => {
      snaps.splice(originalIndex, 1);
      saveSnaps();
      renderLibrary();
      showToast('Снимок удалён');
    });
  });

  if (!learn.pos.length) renderEmpty(posGrid, 'Положительных примеров пока нет');
  else learn.pos.forEach((s, i) => renderCell(posGrid, s.thumb, '№' + (i + 1), () => {
    learn.pos.splice(i, 1);
    saveLearn(); rebuildLUTs(); renderLibrary();
  }));

  if (!learn.neg.length) renderEmpty(negGrid, 'Отрицательных примеров пока нет');
  else learn.neg.forEach((s, i) => renderCell(negGrid, s.thumb, '№' + (i + 1), () => {
    learn.neg.splice(i, 1);
    saveLearn(); rebuildLUTs(); renderLibrary();
  }));
}

// Detection
function medianLum() {
  const hist = new Uint16Array(32);
  let total = 0;
  for (let p = 0; p < N; p += 8) {
    const lum = (avgR[p] * .3 + avgG[p] * .59 + avgB[p] * .11) / 255;
    hist[Math.min(31, (lum * 32) | 0)]++;
    total++;
  }
  let acc = 0;
  for (let i = 0; i < 32; i++) {
    acc += hist[i];
    if (acc > total / 3) return i / 32;
  }
  return .5;
}
function shapeScore(blob, lum) {
  const minSize = lum < .35 ? 20 : 28;
  if (blob.size < minSize || blob.size > N * .45 || blob.fill < .28 || blob.ratio > 3.5) return 0;
  const ratioFit = 1 - Math.min(1, Math.log(blob.ratio) / Math.log(3.5));
  const sizeBonus = Math.min(1, Math.sqrt(blob.size / 500));
  return blob.fill * (.55 + .45 * ratioFit) * (.55 + .45 * sizeBonus);
}
function findBlobs(mask) {
  const visited = new Uint8Array(N);
  const blobs = [];
  const stack = [];
  for (let start = 0; start < N; start++) {
    if (!mask[start] || visited[start]) continue;
    stack.length = 0;
    stack.push(start);
    visited[start] = 1;
    let size = 0, sumX = 0, sumY = 0, sumMot = 0, sumGrad = 0;
    let minX = W, maxX = 0, minY = H, maxY = 0;

    while (stack.length) {
      const p = stack.pop();
      const x = p % W, y = (p / W) | 0;
      size++; sumX += x; sumY += y;
      sumMot += motionEMA[p]; sumGrad += gradBuf[p];
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);

      if (x > 0 && mask[p - 1] && !visited[p - 1]) { visited[p - 1] = 1; stack.push(p - 1); }
      if (x < W - 1 && mask[p + 1] && !visited[p + 1]) { visited[p + 1] = 1; stack.push(p + 1); }
      if (y > 0 && mask[p - W] && !visited[p - W]) { visited[p - W] = 1; stack.push(p - W); }
      if (y < H - 1 && mask[p + W] && !visited[p + W]) { visited[p + W] = 1; stack.push(p + W); }
    }

    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    blobs.push({
      size,
      fill: size / (bw * bh),
      ratio: Math.max(bw, bh) / Math.max(1, Math.min(bw, bh)),
      cx: sumX / size, cy: sumY / size,
      minX, maxX, minY, maxY,
      motionAvg: sumMot / size,
      gradAvg: sumGrad / size,
      score: 0, ls: null
    });
  }
  return blobs;
}
// Сливаем близкие пятна: рваная маска канарейки превращается в одно-два пятна.
function mergeCloseBlobs(blobs) {
  let list = blobs.slice();
  let merged = true;
  while (merged) {
    merged = false;
    for (let i = 0; i < list.length; i++) {
      if (!list[i]) continue;
      for (let j = i + 1; j < list.length; j++) {
        if (!list[j]) continue;
        const a = list[i], b = list[j];
        if (a.minX - MERGE_PAD <= b.maxX && b.minX - MERGE_PAD <= a.maxX &&
            a.minY - MERGE_PAD <= b.maxY && b.minY - MERGE_PAD <= a.maxY) {
          const size = a.size + b.size;
          const minX = Math.min(a.minX, b.minX), maxX = Math.max(a.maxX, b.maxX);
          const minY = Math.min(a.minY, b.minY), maxY = Math.max(a.maxY, b.maxY);
          const bw = maxX - minX + 1, bh = maxY - minY + 1;
          list[i] = {
            size,
            fill: size / (bw * bh),
            ratio: Math.max(bw, bh) / Math.max(1, Math.min(bw, bh)),
            cx: (a.cx * a.size + b.cx * b.size) / size,
            cy: (a.cy * a.size + b.cy * b.size) / size,
            minX, maxX, minY, maxY,
            motionAvg: (a.motionAvg * a.size + b.motionAvg * b.size) / size,
            gradAvg: (a.gradAvg * a.size + b.gradAvg * b.size) / size,
            score: 0, ls: null
          };
          list[j] = null;
          merged = true;
        }
      }
    }
    list = list.filter(Boolean);
  }
  return list;
}
function dilate(mask) {
  const copy = mask.slice();
  for (let p = 0; p < N; p++) {
    if (copy[p]) continue;
    const x = p % W, y = (p / W) | 0;
    if ((x > 0 && copy[p - 1]) || (x < W - 1 && copy[p + 1]) ||
        (y > 0 && copy[p - W]) || (y < H - 1 && copy[p + W])) mask[p] = 1;
  }
}
function drawOverlay() {
  const vw = overlay.width, vh = overlay.height;
  if (!vw || !running) return;
  octx.clearRect(0, 0, vw, vh);
  const sx = vw / W, sy = vh / H;

  for (const blob of lastBlobs) {
    const isBest = blob === bestBlob;
    if (blob.size < 15 && !isBest) continue;
    octx.lineWidth = isBest ? 4 : 2;
    octx.strokeStyle = isBest ? '#4f4' : '#ff3';
    octx.strokeRect(blob.minX * sx, blob.minY * sy,
      (blob.maxX - blob.minX + 1) * sx, (blob.maxY - blob.minY + 1) * sy);
    if (isBest) {
      // Подпись рисуется с учётом зеркалирования, чтобы читалась правильно.
      const lx = blob.minX * sx;
      const ly = Math.max(22, blob.minY * sy - 6);
      octx.fillStyle = '#4f4';
      octx.font = 'bold 22px system-ui';
      octx.save();
      if (mirror) {
        octx.translate(vw - lx, ly);
        octx.scale(-1, 1);
        octx.fillText('🐤 ' + Math.round(blob.score * 100) + '%', 0, 0);
      } else {
        octx.fillText('🐤 ' + Math.round(blob.score * 100) + '%', lx, ly);
      }
      octx.restore();
    }
  }

  if (press) {
    const fraction = Math.min(1, (Date.now() - press.t0) / HOLD_MS);
    octx.beginPath();
    octx.arc((press.gx + .5) * sx, (press.gy + .5) * sy,
      Math.max(30, TAP_RADIUS * sx), -Math.PI / 2,
      -Math.PI / 2 + fraction * Math.PI * 2);
    octx.lineWidth = 6;
    octx.strokeStyle = fraction < 1 ? '#ffd54f' : '#f44';
    octx.stroke();
    if (!press.longDone && fraction >= 1) {
      press.longDone = true;
      if (navigator.vibrate) navigator.vibrate(40);
    }
  }

  if (Date.now() < flashUntil && !press) {
    octx.lineWidth = 5;
    octx.strokeStyle = flashColor;
    if (flashBox) {
      octx.strokeRect(flashBox.minX * sx - 3, flashBox.minY * sy - 3,
        (flashBox.maxX - flashBox.minX + 1) * sx + 6,
        (flashBox.maxY - flashBox.minY + 1) * sy + 6);
    } else if (flashPoint) {
      octx.beginPath();
      octx.arc((flashPoint[0] + .5) * sx, (flashPoint[1] + .5) * sy,
        TAP_RADIUS * sx, 0, Math.PI * 2);
      octx.stroke();
    }
  }
}

function analyze() {
  if (!running || document.hidden || !video.videoWidth || video.readyState < 2) return;
  try {
    ctx.drawImage(video, 0, 0, W, H);
    const data = ctx.getImageData(0, 0, W, H).data;
    framesProcessed++;

    const averageAlpha = buffersReady ? EMA_ALPHA : 1;
    const backgroundAlpha = framesProcessed < 10 ? 1 : BG_ALPHA;
    const motionThresholdSquared = MOTION_THR * MOTION_THR;

    for (let p = 0, i = 0; p < N; p++, i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      avgR[p] += (r - avgR[p]) * averageAlpha;
      avgG[p] += (g - avgG[p]) * averageAlpha;
      avgB[p] += (b - avgB[p]) * averageAlpha;
      const dr = r - bgR[p], dg = g - bgG[p], db = b - bgB[p];
      const moving = dr * dr + dg * dg + db * db > motionThresholdSquared;
      motionEMA[p] = motionEMA[p] * (1 - MOTION_ALPHA) + (moving ? MOTION_ALPHA : 0);
      bgR[p] += (r - bgR[p]) * backgroundAlpha;
      bgG[p] += (g - bgG[p]) * backgroundAlpha;
      bgB[p] += (b - bgB[p]) * backgroundAlpha;
    }
    buffersReady = true;

    let lumSum = 0;
    for (let p = 0; p < N; p++) {
      const lum = avgR[p] * .299 + avgG[p] * .587 + avgB[p] * .114;
      lumBuf[p] = lum;
      lumSum += lum;
    }
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const p = y * W + x;
        const gx = x > 0 && x < W - 1 ? Math.abs(lumBuf[p + 1] - lumBuf[p - 1]) : 0;
        const gy = y > 0 && y < H - 1 ? Math.abs(lumBuf[p + W] - lumBuf[p - W]) : 0;
        gradBuf[p] = gx + gy;
      }
    }

    const lumAverage = lumSum / N / 255;
    const lum = medianLum();
    const sMin = lum > .7 ? .26 : .30;
    const vMin = Math.max(.18, Math.min(.45, lum * .55));
    const useLUT = learn.pos.length > 0 || learn.neg.length > 0;
    const mask = new Uint8Array(N);

    for (let p = 0; p < N; p++) {
      const r = avgR[p], g = avgG[p], b = avgB[p];
      const hsv = hsvOf(r, g, b);
      const yellow = hsv[1] > sMin && hsv[2] > vMin && hsv[2] < .98 && hsv[0] >= 22 && hsv[0] <= 90;
      if (yellow) {
        mask[p] = 1;
      } else if (useLUT) {
        const index = lutIndex(r | 0, g | 0, b | 0);
        if (posLUT[index] && !negLUT[index]) mask[p] = 1;
      }
    }
    dilate(mask);
    dilate(mask);

    const blobs = mergeCloseBlobs(findBlobs(mask));
    lastBlobs = blobs;
    lastMask = mask;

    let best = null, bestScore = 0;
    for (const blob of blobs) {
      let score = shapeScore(blob, lumAverage);
      if (score <= 0) { blob.score = 0; continue; }

      let learned = null;
      if (learn.pos.length || learn.neg.length) {
        const hist = histFromBlob(blob, mask);
        if (hist) {
          learned = learnedScore(hist);
          blob.ls = learned;
          // Отбрасываем только при уверенном совпадении с негативами
          // и при наличии хотя бы одного позитива.
          if (learned !== null && learned < .10 && learn.pos.length >= 1) {
            blob.score = 0;
            continue;
          }
          if (learned !== null) score *= Math.min(1.5, .25 + 1.5 * learned);
        }
      }
      let motionMultiplier = .4 + .6 * Math.min(1, blob.motionAvg * 4);
      if (learned !== null && learned > .6) motionMultiplier = Math.max(motionMultiplier, .8);
      score *= motionMultiplier;
      score *= .75 + .25 * Math.min(1, blob.gradAvg / 25);
      blob.score = score;
      if (score > bestScore) { bestScore = score; best = blob; }
    }
    bestBlob = best;

    emaScore = emaScore * (1 - EMA_ALPHA) + bestScore * EMA_ALPHA;
    rawVotes.push(Boolean(best));
    if (rawVotes.length > 5) rawVotes.shift();

    if (best && prevCx >= 0 && Math.hypot(best.cx - prevCx, best.cy - prevCy) > W / 2.5) {
      emaScore = bestScore;
      rawVotes = [];
    }
    if (best) { prevCx = best.cx; prevCy = best.cy; }

    const rawHits = rawVotes.filter(Boolean).length;
    const now = Date.now();
    if (warmupFrames <= 0 && emaScore >= triggerEMA && rawHits >= 2 &&
        now - lastAlarm > COOLDOWN_MS) {
      lastAlarm = now;
      setAlarm(true);
      captureSnapshot();
    }
    if (emaScore < triggerEMA * .5) setAlarm(false);
    if (warmupFrames > 0) warmupFrames--;

    if (best) {
      statusEl.textContent = `🐤 Возможная канарейка: ${Math.round(bestScore * 100)}%`;
      statusEl.classList.add('found');
      statusEl.classList.toggle('alarm', alarmActive);
    } else {
      statusEl.textContent = alarmActive ? '🐤 Объект временно не виден' : 'Канарейки не видно';
      statusEl.classList.remove('found');
      statusEl.classList.toggle('alarm', alarmActive);
    }

    const parts = [`пятен: ${blobs.length}`];
    if (best) {
      parts.push(`оценка ${Math.round(bestScore * 100)}%`);
      if (best.ls !== null) parts.push(`похожесть ${best.ls.toFixed(2)}`);
      parts.push(`движение ${Math.round(best.motionAvg * 100)}%`);
    }
    parts.push(`сглаживание ${emaScore.toFixed(2)}`);
    parts.push(`свет ${lum.toFixed(2)}`);
    parts.push(`порог ${triggerEMA.toFixed(2)}`);
    parts.push(`✓${learn.pos.length} ✗${learn.neg.length}`);
    debugEl.textContent = parts.join(' · ');
    drawOverlay();
  } catch (error) {
    console.error('Ошибка анализа кадра:', error);
    debugEl.textContent = 'Ошибка обработки видео. Проверьте консоль браузера.';
  }
}

rebuildLUTs();
</script>
