<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Детектор канарейки 🐤 v2</title>
<style>
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #111; color: #eee;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 8px;
  }
  .camwrap { position: relative; width: 100%; max-width: 480px; }
  #video { width: 100%; display: block; border-radius: 8px; background: #000; }
  #overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #status {
    font-size: 1.05em; margin: 8px; padding: 10px 16px;
    border-radius: 12px; background: #222; text-align: center;
  }
  #status.found { background: #1b5e20; }
  #status.alarm { background: #7f1d1d; }
  #debug { color: #888; font-size: 0.72em; margin: 4px; text-align: center; line-height: 1.4; }
  #panel { display: flex; gap: 8px; margin: 6px; flex-wrap: wrap; justify-content: center; }
  button {
    font-size: 0.92em; padding: 10px 14px; border: none;
    border-radius: 20px; background: #ffd54f; color: #222;
  }
  button.off { background: #444; color: #aaa; }
  #sensWrap {
    display: flex; align-items: center; gap: 10px; margin: 6px 10px;
    font-size: 0.9em; color: #ccc; width: 100%; max-width: 480px;
  }
  #sensWrap input { flex: 1; accent-color: #ffd54f; }

  .modal {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.93);
    flex-direction: column; align-items: center; padding: 12px; overflow-y: auto;
  }
  .modal.open { display: flex; }
  #trainCanvas { max-width: 100%; max-height: 55vh; touch-action: none; border-radius: 6px; }
  #trainHint { margin: 10px; text-align: center; color: #ccc; font-size: 0.9em; }
  #trainBtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
  #trainBtns .ok { background: #4caf50; color: #fff; }
  #trainBtns .no { background: #f44336; color: #fff; }

  #libModal h3 { margin: 12px 0 6px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .cell { text-align: center; }
  .cell img {
    width: 96px; height: 96px; object-fit: cover;
    border-radius: 6px; border: 2px solid #555;
  }
  .cell .cap { font-size: 0.65em; color: #999; max-width: 96px; overflow: hidden; }
  .empty { color: #666; font-size: 0.9em; margin: 8px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 18px; border-radius: 20px;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 40;
    max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="camwrap">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>
<div id="status">Нажмите «Запустить камеру»</div>
<div id="debug"></div>
<div id="sensWrap">
  <span>Чувствительность</span>
  <input type="range" id="sens" min="0" max="100" value="50" step="1">
  <span id="sensVal">50</span>
</div>
<div id="panel">
  <button id="btn">▶ Запустить камеру</button>
  <button id="flip">📷 Сменить камеру</button>
  <button id="sound" class="off">🔇 Звук: выкл</button>
  <button id="libBtn">📚 Библиотека</button>
  <button id="photo">🖼 Обучить по фото</button>
  <button id="forget">🗑 Забыть обучение</button>
</div>

<div id="trainModal" class="modal">
  <div id="trainHint">Обведите канарейку рамкой, затем нажмите кнопку.<br>Можно загрузить сразу несколько фото — они пойдут по очереди.</div>
  <canvas id="trainCanvas"></canvas>
  <div id="trainBtns">
    <button class="ok" id="trainPos">✓ В рамке канарейка</button>
    <button class="no" id="trainNeg">✗ Канарейки нет</button>
    <button id="trainClose">Закрыть</button>
  </div>
</div>

<div id="libModal" class="modal">
  <h3>📚 Снимки при срабатываниях</h3>
  <div class="grid" id="snapGrid"></div>
  <h3>✓ Примеры «канарейка» (тап по рамке)</h3>
  <div class="grid" id="posGrid"></div>
  <h3>✗ Примеры «не канарейка» (удержание на рамке / тап по фону)</h3>
  <div class="grid" id="negGrid"></div>
  <button id="libClose" style="margin:16px">Закрыть</button>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<script>
// ============================================================
// Элементы DOM
// ============================================================
const video    = document.getElementById('video');
const overlay  = document.getElementById('overlay');
const octx     = overlay.getContext('2d');
const statusEl = document.getElementById('status');
const debugEl  = document.getElementById('debug');
const btn      = document.getElementById('btn');
const flipBtn  = document.getElementById('flip');
const soundBtn = document.getElementById('sound');
const libBtn   = document.getElementById('libBtn');
const photoBtn = document.getElementById('photo');
const forgetBtn= document.getElementById('forget');
const toastEl  = document.getElementById('toast');
const sensEl   = document.getElementById('sens');
const sensValEl= document.getElementById('sensVal');

// ============================================================
// Константы
// ============================================================
const W = 240, H = 180, N = W * H;
const INTERVAL_MS  = 800;
const EMA_ALPHA    = 0.55;
const BG_ALPHA     = 0.045;
const MOTION_ALPHA = 0.30;
const MOTION_THR   = 40;         // RGB-дистанция (не квадрат)
const COOLDOWN_MS  = 8000;
const TAP_RADIUS   = 10;
const MAX_SAMPLES  = 25;
const MAX_SNAPS    = 20;
const HOLD_MS      = 600;
const RAW_VOTES    = 5;
const RAW_HITS_MIN = 2;

let TRIGGER_EMA = 0.30;

// ============================================================
// Состояние
// ============================================================
let running = false, started = false;
let facing = 'environment', soundOn = false;
let alarmActive = false, lastAlarm = 0;
let prevCx = -1, prevCy = -1;
let emaScore = 0;
const rawVotes = [];
let framesProcessed = 0;
let warmupFrames = 0;

// ============================================================
// Буферы (аллоцируются один раз)
// ============================================================
const avgR = new Float32Array(N);
const avgG = new Float32Array(N);
const avgB = new Float32Array(N);
const bgR  = new Float32Array(N);
const bgG  = new Float32Array(N);
const bgB  = new Float32Array(N);
const motionEMA = new Float32Array(N);
const lumBuf    = new Float32Array(N);
const gradBuf   = new Float32Array(N);
let buffersReady = false;

// Рабочие canvas'ы
const workCanvas = document.createElement('canvas');
workCanvas.width = W; workCanvas.height = H;
const ctx = workCanvas.getContext('2d', { willReadFrequently: true });

const snapCanvas = document.createElement('canvas');
const snapCtx = snapCanvas.getContext('2d');

// ============================================================
// LUT для попиксельного обучения (4-бит RGB = 4096 ячеек)
// ============================================================
const LUT_SIZE = 4096;
const posLUT = new Uint8Array(LUT_SIZE);
const negLUT = new Uint8Array(LUT_SIZE);

function lutIndex(r, g, b) {
  return ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
}
function markLUT(lut, r, g, b) {
  const ri = r >> 4, gi = g >> 4, bi = b >> 4;
  for (let dr = -1; dr <= 1; dr++)
    for (let dg = -1; dg <= 1; dg++)
      for (let db = -1; db <= 1; db++) {
        const rr = ri + dr, gg = gi + dg, bb = bi + db;
        if (rr >= 0 && rr < 16 && gg >= 0 && gg < 16 && bb >= 0 && bb < 16)
          lut[(rr << 8) | (gg << 4) | bb] = 1;
      }
}
function rebuildLUTs() {
  posLUT.fill(0);
  negLUT.fill(0);
  for (const s of learn.pos) if (s.pal) for (const c of s.pal) markLUT(posLUT, c[0], c[1], c[2]);
  for (const s of learn.neg) if (s.pal) for (const c of s.pal) markLUT(negLUT, c[0], c[1], c[2]);
}
function extractPalette(pixels, n) {
  n = n || 6;
  const counts = new Uint16Array(LUT_SIZE);
  for (const px of pixels) {
    counts[lutIndex(px[0] | 0, px[1] | 0, px[2] | 0)]++;
  }
  const order = [];
  for (let i = 0; i < LUT_SIZE; i++) if (counts[i]) order.push([i, counts[i]]);
  order.sort((a, b) => b[1] - a[1]);
  return order.slice(0, n).map(([i]) => [
    (((i >> 8) & 15) << 4) + 8,
    (((i >> 4) & 15) << 4) + 8,
    ((i & 15) << 4) + 8
  ]);
}

// ============================================================
// Хранилища
// ============================================================
const LEARN_KEY = 'canary_learn_v4';
const PREFS_KEY = 'canary_prefs_v4';
const SNAPS_KEY = 'canary_snaps_v4';

let learn = { pos: [], neg: [] };
let snaps = [];

try {
  const saved = JSON.parse(localStorage.getItem(LEARN_KEY));
  if (saved && Array.isArray(saved.pos) && Array.isArray(saved.neg)) learn = saved;
} catch (e) {}
try { snaps = JSON.parse(localStorage.getItem(SNAPS_KEY)) || []; } catch (e) {}

function saveLearn() { try { localStorage.setItem(LEARN_KEY, JSON.stringify(learn)); } catch (e) {} }
function saveSnaps() { try { localStorage.setItem(SNAPS_KEY, JSON.stringify(snaps)); } catch (e) {} }

let sensitivity = 50;
try {
  const prefs = JSON.parse(localStorage.getItem(PREFS_KEY)) || {};
  if (typeof prefs.soundOn === 'boolean') soundOn = prefs.soundOn;
  if (prefs.facing) facing = prefs.facing;
  if (typeof prefs.sensitivity === 'number') sensitivity = prefs.sensitivity;
} catch (e) {}

function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ soundOn, facing, sensitivity })); } catch (e) {}
}

function applySensitivity() {
  sensValEl.textContent = sensitivity;
  sensEl.value = sensitivity;
  TRIGGER_EMA = 0.45 - (sensitivity / 100) * 0.35; // 0.45 .. 0.10
}
applySensitivity();

sensEl.addEventListener('input', () => {
  sensitivity = +sensEl.value;
  applySensitivity();
  savePrefs();
});

soundBtn.textContent = soundOn ? '🔊 Звук: вкл' : '🔇 Звук: выкл';
soundBtn.classList.toggle('off', !soundOn);
flipBtn.textContent = facing === 'user' ? '🤳 Фронталка' : '📷 Сменить камеру';

rebuildLUTs();

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

// ============================================================
// Пищалка
// ============================================================
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
document.body.addEventListener('pointerdown', unlockAudio);
document.addEventListener('visibilitychange', () => { if (!document.hidden) unlockAudio(); });

function tone(freq, durMs, vol, delayMs) {
  if (!audioCtx || audioCtx.state !== 'running') return false;
  try {
    const t0 = audioCtx.currentTime + (delayMs || 0) / 1000;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs / 1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + durMs / 1000 + 0.05);
    return true;
  } catch (e) { return false; }
}
function chirp() {
  const ok = tone(1100, 110, 0.5, 0) && tone(1350, 110, 0.5, 140) && tone(1600, 200, 0.5, 280);
  if (!ok && navigator.vibrate) navigator.vibrate([120, 80, 120, 80, 200]);
}
let alarmTimer = null;
function setAlarm(on) {
  if (on === alarmActive) return;
  alarmActive = on;
  if (on) { unlockAudio(); chirp(); alarmTimer = setInterval(chirp, 1100); }
  else if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
}

soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊 Звук: вкл' : '🔇 Звук: выкл';
  soundBtn.classList.toggle('off', !soundOn);
  savePrefs();
  if (soundOn) { unlockAudio(); chirp(); }
});

forgetBtn.addEventListener('click', () => {
  learn = { pos: [], neg: [] };
  posLUT.fill(0);
  negLUT.fill(0);
  saveLearn();
  showToast('Обучение сброшено (снимки остались)');
});

// ============================================================
// Камера
// ============================================================
async function start() {
  if (started) return;
  btn.disabled = true; btn.textContent = '▶ Запускаю…';
  statusEl.textContent = 'Запрашиваю доступ к камере…';
  try {
    await openStream();
    started = true;
    btn.textContent = '▶ Работает';
    running = true;
    warmupFrames = 4;
    statusEl.textContent = 'Тап по рамке = «канарейка», удержание на рамке = «не канарейка»';
    setInterval(analyze, INTERVAL_MS);
  } catch (e) {
    btn.disabled = false; btn.textContent = '▶ Запустить камеру';
    let msg = 'Не удалось запустить камеру: ' + (e.message || e);
    if (e && e.name === 'NotAllowedError') msg = 'Доступ к камере запрещён. Разрешите камеру в настройках сайта и попробуйте снова.';
    if (e && e.name === 'NotFoundError') msg = 'Камера не найдена на этом устройстве.';
    statusEl.textContent = msg;
  }
}
btn.addEventListener('click', start);

async function openStream() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing },
             width: { ideal: 640 }, height: { ideal: 480 },
             frameRate: { ideal: 5, max: 15 } },
    audio: false
  });
  video.srcObject = stream;
  if (video.readyState < 2) {
    await new Promise(res => video.addEventListener('loadeddata', res, { once: true }));
  }
  try { await video.play(); } catch (e) {}
  const track = stream.getVideoTracks()[0];
  if (track && 'contentHint' in track) track.contentHint = 'motion';
}

video.addEventListener('loadedmetadata', () => {
  overlay.width  = video.videoWidth  || 640;
  overlay.height = video.videoHeight || 480;
});

async function flipCamera() {
  facing = facing === 'environment' ? 'user' : 'environment';
  flipBtn.textContent = facing === 'user' ? '🤳 Фронталка' : '📷 Сменить камеру';
  savePrefs();
  buffersReady = false;
  warmupFrames = 4;
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    try { await openStream(); } catch (e) { statusEl.textContent = 'Не удалось переключить камеру'; }
  }
}
flipBtn.addEventListener('click', flipCamera);

// ============================================================
// Гистограммы (те же 12×3×3 = 108 бин, что в v3)
// ============================================================
const HBINS = 12, SBINS = 3, VBINS = 3;
const HBIN_SIZE = HBINS * SBINS * VBINS;

function hsvOf(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const v = max / 255;
  const s = max === 0 ? 0 : (max - min) / max;
  let h = 0;
  if (max !== min) {
    const d = max - min;
    if (max === r)      h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
    else if (max === g) h = ((b - r) / d + 2) * 60;
    else                h = ((r - g) / d + 4) * 60;
  }
  return [h, s, v];
}
function buildHist(collect) {
  const hist = new Float32Array(HBIN_SIZE);
  let n = 0;
  for (const px of collect) {
    const [h, s, v] = hsvOf(px[0], px[1], px[2]);
    if (s <= 0.12 || v <= 0.12) continue;
    const hi = Math.min(HBINS - 1, h / 30 | 0);
    const si = Math.min(SBINS - 1, s * SBINS | 0);
    const vi = Math.min(VBINS - 1, v * VBINS | 0);
    hist[hi * SBINS * VBINS + si * VBINS + vi]++;
    n++;
  }
  if (n === 0) return null;
  for (let i = 0; i < hist.length; i++) hist[i] /= n;
  return hist;
}
function histFromBlob(blob, mask) {
  const collect = [];
  for (let y = blob.minY; y <= blob.maxY; y++)
    for (let x = blob.minX; x <= blob.maxX; x++) {
      const p = y * W + x;
      if (mask[p]) collect.push([avgR[p], avgG[p], avgB[p]]);
    }
  return buildHist(collect);
}
function histFromTap(gx, gy) {
  const collect = [];
  for (let y = Math.max(0, gy - TAP_RADIUS); y <= Math.min(H - 1, gy + TAP_RADIUS); y++)
    for (let x = Math.max(0, gx - TAP_RADIUS); x <= Math.min(W - 1, gx + TAP_RADIUS); x++)
      collect.push([avgR[y * W + x], avgG[y * W + x], avgB[y * W + x]]);
  return buildHist(collect);
}
function sim(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += Math.min(a[i], b[i]);
  return s;
}
function learnedScore(hist) {
  if (!hist || (learn.pos.length === 0 && learn.neg.length === 0)) return null;
  let posBest = 0, negBest = 0;
  for (const e of learn.pos) posBest = Math.max(posBest, sim(hist, e.hist));
  for (const e of learn.neg) negBest = Math.max(negBest, sim(hist, e.hist));
  return Math.max(0, Math.min(1, 0.5 + (posBest - negBest) * 1.2));
}

// ============================================================
// Миниатюры и палитра
// ============================================================
function thumbFromCells(x0, y0, x1, y1, mask, size) {
  size = size || 64;
  snapCanvas.width = size; snapCanvas.height = size;
  snapCtx.fillStyle = '#000'; snapCtx.fillRect(0, 0, size, size);
  const cw = Math.max(1, (size / (x1 - x0 + 1)) | 0);
  const ch = Math.max(1, (size / (y1 - y0 + 1)) | 0);
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const p = y * W + x;
      if (mask && !mask[p]) continue;
      snapCtx.fillStyle = `rgb(${avgR[p] | 0},${avgG[p] | 0},${avgB[p] | 0})`;
      snapCtx.fillRect((x - x0) * cw, (y - y0) * ch, cw, ch);
    }
  return snapCanvas.toDataURL('image/jpeg', 0.6);
}

function paletteFromRegion(x0, y0, x1, y1, mask) {
  const px = [];
  for (let y = y0; y <= y1; y += 2) {
    for (let x = x0; x <= x1; x += 2) {
      const p = y * W + x;
      if (mask && !mask[p]) continue;
      px.push([avgR[p] | 0, avgG[p] | 0, avgB[p] | 0]);
    }
  }
  return extractPalette(px, 6);
}

function addLearn(isPos, hist, thumb, pal) {
  const arr = isPos ? learn.pos : learn.neg;
  arr.push({ hist: Array.from(hist), thumb, pal: pal || null });
  if (arr.length > MAX_SAMPLES) arr.shift();
  saveLearn();
  rebuildLUTs();
}

// ============================================================
// Тап / удержание
// ============================================================
let flashUntil = 0, flashBox = null, flashColor = '#4f4', flashPoint = null;
function flashRect(b, color) { flashBox = b; flashColor = color; flashPoint = null; flashUntil = Date.now() + 1200; }
function flashTap(gx, gy, color) { flashPoint = [gx, gy]; flashColor = color; flashBox = null; flashUntil = Date.now() + 1200; }

let press = null;
let holdRaf = null;

overlay.addEventListener('contextmenu', e => e.preventDefault());

overlay.addEventListener('pointerdown', (e) => {
  if (!running || !buffersReady) return;
  const rect = overlay.getBoundingClientRect();
  const gx = Math.floor((e.clientX - rect.left) / rect.width  * W);
  const gy = Math.floor((e.clientY - rect.top)  / rect.height * H);
  if (gx < 0 || gy < 0 || gx >= W || gy >= H) return;
  const hit = lastBlobs.find(b => gx >= b.minX && gx <= b.maxX && gy >= b.minY && gy <= b.maxY);
  press = { gx, gy, hit, t0: Date.now(), longDone: false };
  overlay.setPointerCapture(e.pointerId);
  const tick = () => {
    if (!press) { holdRaf = null; return; }
    drawOverlay();
    holdRaf = requestAnimationFrame(tick);
  };
  holdRaf = requestAnimationFrame(tick);
});

function endPress() {
  if (!press) return;
  const { gx, gy, hit, t0, longDone } = press;
  press = null;
  const held = longDone || (Date.now() - t0 >= HOLD_MS);

  if (hit) {
    const hist = histFromBlob(hit, lastMask);
    if (!hist) { showToast('Слишком темно, нечего запоминать'); return; }
    const pal = paletteFromRegion(hit.minX, hit.minY, hit.maxX, hit.maxY, lastMask);
    const thumb = thumbFromCells(hit.minX, hit.minY, hit.maxX, hit.maxY, lastMask);
    if (held) {
      addLearn(false, hist, thumb, pal);
      showToast('✗ Запомнил: НЕ канарейка (' + learn.neg.length + ')');
      flashRect(hit, '#f44');
    } else {
      addLearn(true, hist, thumb, pal);
      showToast('✓ Запомнил: канарейка (' + learn.pos.length + ')');
      flashRect(hit, '#4f4');
    }
  } else {
    const hist = histFromTap(gx, gy);
    if (hist) {
      const x0 = Math.max(0, gx - TAP_RADIUS), x1 = Math.min(W - 1, gx + TAP_RADIUS);
      const y0 = Math.max(0, gy - TAP_RADIUS), y1 = Math.min(H - 1, gy + TAP_RADIUS);
      const pal = paletteFromRegion(x0, y0, x1, y1, null);
      const thumb = thumbFromCells(x0, y0, x1, y1, null);
      addLearn(false, hist, thumb, pal);
      showToast('✗ Запомнил: фон, НЕ канарейка (' + learn.neg.length + ')');
      flashTap(gx, gy, '#f44');
    } else showToast('Слишком темно, нечего запоминать');
  }
}

overlay.addEventListener('pointerup', endPress);
overlay.addEventListener('pointercancel', () => { press = null; });

// ============================================================
// Обучение по фото
// ============================================================
const trainModal  = document.getElementById('trainModal');
const trainCanvas = document.getElementById('trainCanvas');
const trainCtx    = trainCanvas.getContext('2d');
const fileInput   = document.getElementById('fileInput');
const trainHint   = document.getElementById('trainHint');
let photoQueue = [], trainImg = null, dragStart = null, dragNow = null;

photoBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (!fileInput.files || !fileInput.files.length) return;
  photoQueue = Array.from(fileInput.files);
  fileInput.value = '';
  nextPhoto();
});

function nextPhoto() {
  if (!photoQueue.length) { trainModal.classList.remove('open'); return; }
  const file = photoQueue.shift();
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    trainImg = img;
    const scale = Math.min(1, 640 / img.width);
    trainCanvas.width  = img.width  * scale;
    trainCanvas.height = img.height * scale;
    trainCtx.drawImage(img, 0, 0, trainCanvas.width, trainCanvas.height);
    dragStart = dragNow = null;
    trainHint.textContent = 'Осталось фото: ' + photoQueue.length +
      '. Обведите канарейку рамкой → «В рамке канарейка», или «Канарейки нет» для фона.';
    trainModal.classList.add('open');
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { URL.revokeObjectURL(url); nextPhoto(); };
  img.src = url;
}

function trainCoords(e) {
  const r = trainCanvas.getBoundingClientRect();
  return [(e.clientX - r.left) * (trainCanvas.width / r.width),
          (e.clientY - r.top)  * (trainCanvas.height / r.height)];
}
trainCanvas.addEventListener('pointerdown', e => {
  dragStart = trainCoords(e); dragNow = dragStart;
  trainCanvas.setPointerCapture(e.pointerId);
});
trainCanvas.addEventListener('pointermove', e => {
  if (!dragStart) return;
  dragNow = trainCoords(e);
  trainCtx.drawImage(trainImg, 0, 0, trainCanvas.width, trainCanvas.height);
  trainCtx.lineWidth = 3; trainCtx.strokeStyle = '#4f4';
  trainCtx.strokeRect(Math.min(dragStart[0], dragNow[0]), Math.min(dragStart[1], dragNow[1]),
                      Math.abs(dragNow[0] - dragStart[0]), Math.abs(dragNow[1] - dragStart[1]));
});

function saveFromPhoto(isPos) {
  if (!trainImg) return;
  let rect;
  if (isPos) {
    if (!dragStart || !dragNow || Math.abs(dragNow[0]-dragStart[0]) < 8 || Math.abs(dragNow[1]-dragStart[1]) < 8) {
      showToast('Сначала обведите канарейку рамкой'); return;
    }
    rect = [Math.min(dragStart[0], dragNow[0]), Math.min(dragStart[1], dragNow[1]),
            Math.max(dragStart[0], dragNow[0]), Math.max(dragStart[1], dragNow[1])];
  } else {
    rect = [0, 0, trainCanvas.width, trainCanvas.height];
  }
  const data = trainCtx.getImageData(0, 0, trainCanvas.width, trainCanvas.height).data;
  const collect = [];
  for (let y = rect[1] | 0; y < rect[3]; y += 3)
    for (let x = rect[0] | 0; x < rect[2]; x += 3) {
      const i = ((y | 0) * trainCanvas.width + (x | 0)) * 4;
      collect.push([data[i], data[i+1], data[i+2]]);
    }
  const hist = buildHist(collect);
  if (!hist) { showToast('Не получилось извлечь цвета'); return; }
  const pal = extractPalette(collect, 6);

  const tw = 64, th = Math.max(1, (rect[3] - rect[1]) / (rect[2] - rect[0]) * tw) | 0;
  snapCanvas.width = tw; snapCanvas.height = th;
  snapCtx.drawImage(trainCanvas, rect[0], rect[1], rect[2] - rect[0], rect[3] - rect[1], 0, 0, tw, th);
  const thumb = snapCanvas.toDataURL('image/jpeg', 0.6);

  addLearn(isPos, hist, thumb, pal);
  showToast(isPos ? '✓ Канарейка запомнена (' + learn.pos.length + ')'
                  : '✗ Фон без канарейки запомнен (' + learn.neg.length + ')');
  nextPhoto();
}
document.getElementById('trainPos').addEventListener('click', () => saveFromPhoto(true));
document.getElementById('trainNeg').addEventListener('click', () => saveFromPhoto(false));
document.getElementById('trainClose').addEventListener('click', () => { photoQueue = []; trainModal.classList.remove('open'); });

// ============================================================
// Снимок при срабатывании
// ============================================================
function captureSnapshot() {
  try {
    const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
    const w = 320, h = (vh / vw * w) | 0;
    snapCanvas.width = w; snapCanvas.height = h;
    snapCtx.drawImage(video, 0, 0, w, h);
    snaps.push({ img: snapCanvas.toDataURL('image/jpeg', 0.55), t: Date.now() });
    if (snaps.length > MAX_SNAPS) snaps.shift();
    saveSnaps();
  } catch (e) {}
}

// ============================================================
// Библиотека
// ============================================================
const libModal  = document.getElementById('libModal');
const snapGrid  = document.getElementById('snapGrid');
const posGrid   = document.getElementById('posGrid');
const negGrid   = document.getElementById('negGrid');

function renderCell(gridEl, thumb, caption, onDelete) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const img = document.createElement('img');
  img.src = thumb;
  if (onDelete) { img.addEventListener('click', onDelete); img.style.cursor = 'pointer'; img.title = 'Нажмите, чтобы удалить'; }
  const cap = document.createElement('div');
  cap.className = 'cap'; cap.textContent = caption;
  cell.appendChild(img); cell.appendChild(cap);
  gridEl.appendChild(cell);
}
function renderEmpty(gridEl, text) {
  const d = document.createElement('div');
  d.className = 'empty'; d.textContent = text;
  gridEl.appendChild(d);
}

libBtn.addEventListener('click', () => {
  snapGrid.innerHTML = posGrid.innerHTML = negGrid.innerHTML = '';
  if (snaps.length)
    for (let i = snaps.length - 1; i >= 0; i--)
      renderCell(snapGrid, snaps[i].img, new Date(snaps[i].t).toLocaleTimeString('ru-RU'),
        () => { snaps.splice(i, 1); saveSnaps(); libBtn.click(); showToast('Снимок удалён'); });
  else renderEmpty(snapGrid, 'Пока пусто — снимки появляются при срабатывании');

  if (learn.pos.length)
    learn.pos.forEach((e, i) => renderCell(posGrid, e.thumb, '№' + (i + 1),
      () => { learn.pos.splice(i, 1); saveLearn(); rebuildLUTs(); libBtn.click(); showToast('Пример удалён'); }));
  else renderEmpty(posGrid, 'Коротко тапайте по рамке на живой камере');

  if (learn.neg.length)
    learn.neg.forEach((e, i) => renderCell(negGrid, e.thumb, '№' + (i + 1),
      () => { learn.neg.splice(i, 1); saveLearn(); rebuildLUTs(); libBtn.click(); showToast('Пример удалён'); }));
  else renderEmpty(negGrid, 'Удерживайте палец на рамке или тапайте по фону');

  libModal.classList.add('open');
});
document.getElementById('libClose').addEventListener('click', () => libModal.classList.remove('open'));

// ============================================================
// Освещение
// ============================================================
function medianLum() {
  const hist = new Uint16Array(32);
  for (let p = 0; p < N; p += 8) {
    const lum = (avgR[p] * 0.3 + avgG[p] * 0.59 + avgB[p] * 0.11) / 255;
    hist[Math.min(31, lum * 32 | 0)]++;
  }
  let acc = 0;
  const total = N / 8;
  for (let b = 0; b < 32; b++) { acc += hist[b]; if (acc > total / 3) return b / 32; }
  return 0.5;
}

// ============================================================
// Оценка формы + текстура
// ============================================================
function shapeScore(b, lumAvg) {
  const minSize = lumAvg < 0.35 ? 25 : 35;
  if (b.size < minSize) return 0;
  if (b.size > N * 0.45) return 0;
  if (b.fill < 0.32) return 0;
  if (b.ratio > 3.2) return 0;
  const ratioFit = 1 - Math.min(1, Math.log(b.ratio) / Math.log(3.2));
  const sizeBonus = Math.min(1, Math.sqrt(b.size / 500));
  return b.fill * (0.55 + 0.45 * ratioFit) * (0.55 + 0.45 * sizeBonus);
}

// ============================================================
// Связные пятна
// ============================================================
function findBlobs(mask) {
  const visited = new Uint8Array(N);
  const blobs = [];
  const stack = [];
  for (let start = 0; start < N; start++) {
    if (!mask[start] || visited[start]) continue;
    stack.length = 0; stack.push(start);
    visited[start] = 1;
    let size = 0, sumX = 0, sumY = 0, sumMot = 0, sumGrad = 0;
    let minX = W, maxX = 0, minY = H, maxY = 0;
    while (stack.length) {
      const p = stack.pop();
      const x = p % W, y = (p / W) | 0;
      size++; sumX += x; sumY += y;
      sumMot += motionEMA[p];
      sumGrad += gradBuf[p];
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (x > 0   && mask[p-1] && !visited[p-1]) { visited[p-1] = 1; stack.push(p-1); }
      if (x < W-1 && mask[p+1] && !visited[p+1]) { visited[p+1] = 1; stack.push(p+1); }
      if (y > 0   && mask[p-W] && !visited[p-W]) { visited[p-W] = 1; stack.push(p-W); }
      if (y < H-1 && mask[p+W] && !visited[p+W]) { visited[p+W] = 1; stack.push(p+W); }
    }
    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    blobs.push({
      size, fill: size / (bw * bh),
      ratio: Math.max(bw, bh) / Math.min(bw, bh),
      cx: sumX / size, cy: sumY / size,
      minX, maxX, minY, maxY,
      motionAvg: sumMot / size,
      gradAvg: sumGrad / size,
      score: 0, ls: null
    });
  }
  return blobs;
}
function dilate(mask) {
  const copy = mask.slice();
  for (let p = 0; p < N; p++) {
    if (copy[p]) continue;
    const x = p % W, y = (p / W) | 0;
    if ((x > 0 && copy[p-1]) || (x < W-1 && copy[p+1]) ||
        (y > 0 && copy[p-W]) || (y < H-1 && copy[p+W])) mask[p] = 1;
  }
}

// ============================================================
// Отрисовка оверлея
// ============================================================
function drawOverlay() {
  const vw = overlay.width, vh = overlay.height;
  if (!vw) return;
  octx.clearRect(0, 0, vw, vh);
  if (!running) return;
  const sx = vw / W, sy = vh / H;

  for (const b of lastBlobs) {
    if (b.size < 8) continue;
    const isBest = (b === bestBlob);
    octx.lineWidth = isBest ? 4 : 2;
    octx.strokeStyle = isBest ? '#4f4' : '#ff3';
    octx.strokeRect(b.minX * sx, b.minY * sy, (b.maxX - b.minX + 1) * sx, (b.maxY - b.minY + 1) * sy);
    if (isBest) {
      octx.fillStyle = '#4f4';
      octx.font = 'bold 22px system-ui';
      octx.fillText('🐤 ' + (b.score * 100 | 0) + '%', b.minX * sx, Math.max(22, b.minY * sy - 6));
    }
  }

  if (press) {
    const frac = Math.min(1, (Date.now() - press.t0) / HOLD_MS);
    const cx = (press.gx + 0.5) * sx, cy = (press.gy + 0.5) * sy;
    const r = Math.max(30, TAP_RADIUS * sx);
    octx.beginPath();
    octx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + frac * 2 * Math.PI);
    octx.lineWidth = 6;
    octx.strokeStyle = press.hit ? '#4f4' : '#f44';
    octx.stroke();
    if (!press.longDone && frac >= 1) {
      press.longDone = true;
      if (navigator.vibrate) navigator.vibrate(40);
    }
  }

  if (Date.now() < flashUntil && !press) {
    octx.lineWidth = 5;
    octx.strokeStyle = flashColor;
    if (flashBox) {
      octx.strokeRect(flashBox.minX * sx - 3, flashBox.minY * sy - 3,
                      (flashBox.maxX - flashBox.minX + 1) * sx + 6, (flashBox.maxY - flashBox.minY + 1) * sy + 6);
    } else if (flashPoint) {
      octx.beginPath();
      octx.arc((flashPoint[0] + 0.5) * sx, (flashPoint[1] + 0.5) * sy, TAP_RADIUS * sx, 0, Math.PI * 2);
      octx.stroke();
    }
  }
}

// ============================================================
// Главный цикл
// ============================================================
let lastBlobs = [], lastMask = new Uint8Array(N), bestBlob = null;
let lastLumAvg = 0.5;
let lastDebug = '';

function analyze() {
  if (!running || document.hidden) return;
  if (!video.videoWidth || video.readyState < 2) return;

  ctx.drawImage(video, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;
  framesProcessed++;

  // --- Усреднение, фон, движение ---
  const a = buffersReady ? EMA_ALPHA : 1;
  const bgA = framesProcessed < 10 ? 1 : BG_ALPHA;
  const motThr2 = MOTION_THR * MOTION_THR;

  for (let p = 0, i = 0; p < N; p++, i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    avgR[p] += (r - avgR[p]) * a;
    avgG[p] += (g - avgG[p]) * a;
    avgB[p] += (b - avgB[p]) * a;

    const dr = r - bgR[p], dg = g - bgG[p], db = b - bgB[p];
    const moving = (dr*dr + dg*dg + db*db) > motThr2;
    motionEMA[p] = motionEMA[p] * (1 - MOTION_ALPHA) + (moving ? 1 : 0) * MOTION_ALPHA;

    bgR[p] += (r - bgR[p]) * bgA;
    bgG[p] += (g - bgG[p]) * bgA;
    bgB[p] += (b - bgB[p]) * bgA;
  }
  buffersReady = true;

  // --- Освещение и градиенты ---
  let lumSum = 0;
  for (let p = 0; p < N; p++) {
    const l = avgR[p]*0.299 + avgG[p]*0.587 + avgB[p]*0.114;
    lumBuf[p] = l;
    lumSum += l;
  }
  lastLumAvg = lumSum / N / 255;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const p = y*W + x;
      let gx = 0, gy = 0;
      if (x > 0 && x < W-1) gx = Math.abs(lumBuf[p+1] - lumBuf[p-1]);
      if (y > 0 && y < H-1) gy = Math.abs(lumBuf[p+W] - lumBuf[p-W]);
      gradBuf[p] = gx + gy;
    }
  }

  // --- Цветовая маска ---
  const lum = medianLum();
  const sMin = lum > 0.7 ? 0.28 : 0.32;
  const vMin = Math.max(0.18, Math.min(0.45, lum * 0.55));
  const useLUT = learn.pos.length > 0 || learn.neg.length > 0;
  const mask = new Uint8Array(N);

  for (let p = 0; p < N; p++) {
    const r = avgR[p], g = avgG[p], b = avgB[p];
    const [h, s, v] = hsvOf(r, g, b);
    let yellow = false;
    if (s > sMin && v > vMin && v < 0.98 && h >= 22 && h <= 90) yellow = true;
    if (yellow) { mask[p] = 1; continue; }
    if (useLUT) {
      const idx = lutIndex(r | 0, g | 0, b | 0);
      if (posLUT[idx] && !negLUT[idx]) mask[p] = 1;
    }
  }
  dilate(mask);

  const blobs = findBlobs(mask);
  lastBlobs = blobs;
  lastMask = mask;

  // --- Скоринг ---
  let best = null, bestScore = 0;
  for (const b of blobs) {
    let score = shapeScore(b, lum);
    if (score <= 0) { b.score = 0; continue; }

    // Движение: статичный жёлтый объект давится сильно
    score *= 0.15 + 0.85 * Math.min(1, b.motionAvg * 4);

    // Текстура: мягкий множитель 0.75..1.0
    score *= 0.75 + 0.25 * Math.min(1, b.gradAvg / 25);

    // Обучение
    if (learn.pos.length || learn.neg.length) {
      const hist = histFromBlob(b, mask);
      if (hist) {
        const ls = learnedScore(hist);
        b.ls = ls;
        if (ls < 0.15 && learn.neg.length > 0) score = 0;
        else score *= Math.min(1.5, 0.3 + 1.4 * ls);
      }
    }

    b.score = score;
    if (score > bestScore) { bestScore = score; best = b; }
  }
  bestBlob = best;

  // --- Временное сглаживание ---
  emaScore = emaScore * (1 - EMA_ALPHA) + bestScore * EMA_ALPHA;

  rawVotes.push(!!best);
  if (rawVotes.length > RAW_VOTES) rawVotes.shift();
  const rawHits = rawVotes.filter(Boolean).length;

  if (best && prevCx >= 0 && Math.hypot(best.cx - prevCx, best.cy - prevCy) > W / 2.5) {
    emaScore = bestScore;
    rawVotes.length = 0;
  }
  if (best) { prevCx = best.cx; prevCy = best.cy; }

  // --- Тревога ---
  const now = Date.now();
  if (warmupFrames <= 0 &&
      emaScore >= TRIGGER_EMA && rawHits >= RAW_HITS_MIN &&
      now - lastAlarm > COOLDOWN_MS) {
    lastAlarm = now;
    setAlarm(true);
    captureSnapshot();
  }
  if (emaScore < TRIGGER_EMA * 0.5) setAlarm(false);

  if (warmupFrames > 0) warmupFrames--;

  // --- Статус ---
  if (best) {
    statusEl.textContent = '🐤 Канарейка обнаружена! ' + (bestScore * 100 | 0) + '%';
    statusEl.classList.add('found');
    statusEl.classList.remove('alarm');
  } else {
    statusEl.classList.remove('found', 'alarm');
    statusEl.textContent = alarmActive ? '🐤 Канарейка (уходит из кадра)' : 'Канарейки не видно';
  }

  // --- Отладка ---
  const parts = [];
  parts.push('пятен: ' + blobs.length);
  if (best) {
    parts.push('оценка ' + (bestScore * 100 | 0) + '%');
    if (best.ls !== null) parts.push('похожесть ' + best.ls.toFixed(2));
    parts.push('движ ' + (best.motionAvg * 100 | 0) + '%');
    parts.push('текст ' + best.gradAvg.toFixed(0));
  }
  parts.push('сглаж ' + emaScore.toFixed(2));
  parts.push('свет ' + lum.toFixed(2));
  parts.push('порог ' + TRIGGER_EMA.toFixed(2));
  parts.push('✓' + learn.pos.length + ' ✗' + learn.neg.length);
  debugEl.textContent = parts.join(', ');

  drawOverlay();
}
</script>
